# Communication Hub - Locked-Down Configuration for NewX Bot Deployment
# =====================================================================
# ALL outbound communication channels are DISABLED.
# RAICA tools that depend on these channels (secure_email_sender, social
# media posting, SMS, etc.) will fail gracefully when invoked.
#
# This prevents AI bots on NewX from sending emails, posting to external
# social media, or reaching any outside service through RAICA's tools.
#
# To restore full capabilities (e.g. for standalone RAICA use), switch
# back to communication_hub.yaml.
#
# Deployed by: NewX install.sh

communication_hub:

  # Global Settings
  global:
    retry_policy:
      max_retries: 3
      backoff_strategy: exponential
      retry_delays: [1, 5, 15]

    rate_limits:
      per_minute: 10
      per_hour: 100
      per_day: 500

    security:
      max_attachment_size: 26214400
      forbidden_extensions: [.exe, .bat, .cmd, .sh, .scr, .com, .pif]
      content_filtering:
        enabled: true
        max_content_length: 10485760
      credentials:
        encryption: true
        storage: environment_variables

  # Channel Configurations — ALL DISABLED for NewX deployment
  channels:

    email:
      enabled: true  # ENABLED for trusted deep-research delivery (gated server-side by the
                     # per-request allow_delivery flag — NewX bots never send it, so they stay locked)

    twitter:
      enabled: false  # DISABLED — bots must not post to Twitter/X

    substack:
      enabled: false

    wordpress:
      enabled: false

    sms:
      enabled: false

    slack:
      enabled: false

    discord:
      enabled: false

    telegram:
      enabled: false

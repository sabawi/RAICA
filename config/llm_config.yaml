debug:
  log_requests: false
  log_timing: true
  mock_providers: false
document_interrogator:
  max_files_per_scan: 400
  scan_interval_minutes: 60
  auto_watch_enabled: false
  startup_initialization_delay: 3
  embedding:
    # Provider: "openai", "ollama", or any OpenAI-compatible endpoint
    # To switch back to Ollama local: set provider to "ollama" and update service below
    provider: openai
    model_name: text-embedding-3-small
    dimension: 1024
    service:
      base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}
    timeout:
      embedding_request: 30
      health_check: 10
    retry:
      max_attempts: 3
      retry_delay_seconds: 2
    batch_processing:
      batch_size: 50
      batch_delay_seconds: 1.0
      adaptive_mode_enabled: true
      min_batch_size: 1
      adaptive_reduction_factor: 0.5
    # To revert to local Ollama embeddings, use this config:
    # provider: ollama
    # model_name: mxbai-embed-large
    # dimension: 1024
    # service:
    #   host: 127.0.0.1
    #   port: 11434
    #   base_url: http://127.0.0.1:11434
    # timeout:
    #   embedding_request: 120
    #   service_restart: 5
    #   health_check: 10
  document_processing:
    chunk_size: 400
    chunk_overlap: 50
    min_chunk_length: 10
    max_chunk_length: 500
  scaling_notes:
    "SCALING GUIDELINES (based on empirical research):\n\nCurrent configuration\
    \ optimal for: 1K-10K documents (10K-100K chunks)\n\nScaling to 100K+ chunks:\n\
    \  1. Reduce dimension: 1024 \u2192 768 (switch to nomic-embed-text, 33% storage\
    \ savings)\n  2. Implement quantization: FP16 (48% memory reduction) or binary\
    \ (32x reduction)\n  3. Consider separate FAISS instances per document collection\n\
    \nModel choice at scale:\n  - <10K chunks: mxbai-embed-large (current, optimal\
    \ quality)\n  - 10K-100K chunks: Keep mxbai OR switch to nomic for speed\n  -\
    \ 100K-1M chunks: Consider E5-small (384d) or BGE (768d)\n  - 1M+ chunks: Plan\
    \ for distributed embedding service\n\nEmbedding service bottleneck analysis:\n\
    \  - Batch size 25 \xD7 250 tokens/chunk = 6250 tokens/batch \u2192 OOM after\
    \ 1650 vectors\n  - Batch size 10 \xD7 250 tokens/chunk = 2500 tokens/batch \u2192\
    \ Sustainable at scale\n  - Time: 27-30 min for 1961 chunks with batch_size=10\n"
llm:
  fallback:
    auto_switch: true
    enabled: true
    order:
      - ollama
      - openai
      - openrouter
      - qwen
      - gemini
  primary:
    type: ollama
    config:
      model: deepseek-v4-pro:cloud #kimi-k2.6:cloud #minimax-m2.7:cloud
      timeout: 1200
      temperature: 0.7
      max_tokens: 32768
      context_window_size: 200000   # raised from 131072 to fit the +45% deep-research evidence budget (model max is ~1M; cloud cost negligible)
      stream: true
      think: false  # Disable thinking/reasoning output (saves tokens, faster responses)
  tool_calling:
    type: openai
    config:
      model: glm-5.2:cloud   # was qwen3-coder-next:cloud — swapped for more reliable tool selection (qwen threw intermittent 500s on Ollama cloud, breaking news-bot evidence gathering). LOCAL trial first.
      timeout: 120
      context_window_size: 32768
      temperature: 0.1
      max_tokens: 2048
      stream: false
      api_key: "ollama"
      base_url: http://127.0.0.1:11434/v1
  providers:
    ollama:
      base_url: http://127.0.0.1:11434
      health_check_url: http://127.0.0.1:11434/api/tags
      retry_attempts: 3
      retry_delay: 2
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      organization: null
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gpt-4o-mini
        tool_calling: gpt-4o-mini
    openrouter:
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      retry_attempts: 3
      retry_delay: 1
      headers:
        HTTP-Referer: ${OPENROUTER_SITE_URL}
        X-Title: ${OPENROUTER_SITE_NAME}
      models:
        primary: deepseek/deepseek-r1:free
        tool_calling: openai/gpt-4o-mini
        reasoning: deepseek/deepseek-r1
        free: deepseek/deepseek-r1:free
    gemini:
      api_key: ${GEMINI_API_KEY}
      model: gemini-flash-latest
      timeout: 120
      temperature: 0.7
      max_tokens: 8192
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gemini-flash-latest
        pro: gemini-pro-latest
        flash: gemini-flash-latest
        stable_flash: gemini-2.5-flash
        stable_pro: gemini-2.5-pro
performance:
  connection_pool_size: 10
  max_concurrent_requests: 5
  request_timeout: 1200
  streaming_chunk_size: 1024
platform:
  config_dir:
    linux: ${HOME}/.config/agentic_rag
    macos: ${HOME}/.config/agentic_rag
    windows: ${APPDATA}/agentic_rag
  log_dir:
    linux: ${HOME}/.local/share/agentic_rag/logs
    macos: ${HOME}/.local/share/agentic_rag/logs
    windows: ${LOCALAPPDATA}/agentic_rag/logs
  temp_dir:
    linux: /tmp/agentic_rag
    macos: ${TMPDIR}/agentic_rag
    windows: ${TEMP}/agentic_rag
security:
  api_key_encryption: false
  audit_logging: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_limit: 10
arbitrator:
  enabled: true
  type: openai
  config:
    model: glm-5.2:cloud   # was qwen3-coder-next:cloud — same swap as tool_calling; no path should depend on the flaky qwen cloud model.
    timeout: 60
    context_window_size: 4096
    temperature: 0.1
    max_tokens: 1024
    stream: false
    api_key: "ollama"
    base_url: http://127.0.0.1:11434/v1
optimization:
  enabled: true
  rollout_percentage: 100.0
  detailed_logging: true
# ============================================================
# DEEP RESEARCH ENGINE (Stage 0 foundations)
# Source of truth for research depth and the LLM-driven research
# classifier. No depth limits are hardcoded in code anymore.
# ============================================================
deep_research:
  enabled: true
  search:
    web_max_results: 8          # web results per search (legacy hardcoded value was 3)
    per_page_char_budget: 6000  # max chars extracted per page (legacy value was 2000)
    per_page_max_blocks: 12     # max text blocks/paragraphs per page (legacy value was 5)
  citation_verify:
    # Layer 3 of citation accuracy: a LENIENT live check that drops a candidate citation URL ONLY when
    # it is verified dead (hard HTTP 404/410, or a redirect that lands on the site homepage) before it
    # can become a citation. Everything else (200/403/paywall/JS shell/429/5xx/timeout) is KEPT, so a
    # valid article that merely bot-blocks us is never dropped. search_web piggybacks on its existing
    # content fetch (no extra request); news verifies article URLs in parallel. Set enabled:false to turn
    # the whole layer off (e.g. if it adds unacceptable latency to news).
    enabled: true
    timeout_seconds: 6          # per-URL liveness timeout (lenient: a timeout KEEPS the URL)
    max_workers: 8              # parallelism when verifying a batch of news article URLs
  research_classifier:
    # LLM-driven replacement for the old keyword-based _is_research_query().
    # When enabled, an LLM decides (semantically) whether a request is
    # research-oriented so the optimizer preserves more source context.
    # If disabled or unreachable, the system fails SAFE to research=True
    # (maximum context preservation) — it never silently drops accuracy.
    enabled: true
  # ---- Stage 1: Deep Research Engine ----
  engine:
    enabled: true
    # Citation grounding (output-side safety net): classify every cited URL against the GATHERED evidence;
    # strip FABRICATED links (URLs no tool returned — the model invented them, e.g. a 404 news article with a
    # fabricated opaque ID) while distinguishing provider-ROTTED links (gathered but now dead — hot stories
    # get pulled/moved). Start in SHADOW (log only, answer unchanged) to baseline the live fabrication rate;
    # set shadow:false to ENFORCE. No-op on healthy paths (wiki/papers/static — every cited URL is in
    # evidence). on_unsourced governs a block left with 0 valid sources after grounding.
    citation_grounding:
      enabled: true
      shadow: true              # true = compute + log only (answer unchanged); false = enforce (strip)
      on_unsourced: flag        # flag (mark) | drop (remove block) | off
      # Output-side citation LIVENESS (docs/RAICA_DR_CITATION_LIVENESS.md). Actually FETCHES each CITED URL
      # and treats only a hard 404/410 or an article→homepage redirect as dead (403/paywall/JS/timeout are
      # KEPT — a bot-blocked valid article is never dropped). The verified-dead set feeds grounding as
      # `dead_urls` so a dead "Page not found" link is stripped as ROTTED (headline text kept). Phase 0 =
      # SHADOW: fetch + log the would-be dead-strips, answer UNCHANGED, to baseline the live dead-link rate
      # before enforcing. Set shadow:false to ENFORCE (strip). enabled:false turns the whole liveness step off.
      verify_live:
        enabled: true
        shadow: false           # PHASE 1 (v1.0.0.136): ENFORCE — strip verified-dead cited links (headline
                                #   text kept). true = shadow (fetch + log only, answer unchanged).
        timeout_seconds: 6      # lenient per-URL liveness timeout (a timeout KEEPS the URL)
        max_workers: 8          # parallelism for the cited-URL liveness batch
        # A dead verdict is re-verified once (short pause + re-fetch) before a link is stripped, so a
        # transient CDN/rate-limit flap never removes a valid citation (research/link_liveness.py).
    # LOAD-BASED MODEL SPLIT for deep-research LLM calls. Deep research is NOT one-size-fits-all:
    # the high-frequency, SMALL calls (gate, planner, roster, grade, verify — all <~140K chars) run
    # great on the fast/cheap LIGHT model, while the single LARGE call (synthesis, which assembles
    # the whole evidence pile — observed ~596K chars) overwhelms the light cloud endpoint and gets
    # an intermittent HTTP 500. So we route by PAYLOAD SIZE (len(prompt)), not by node name:
    #   * prompt_len  <  heavy_threshold_chars  -> `model`       (light: fast, cheap)
    #   * prompt_len >= heavy_threshold_chars  -> `heavy_model` (heavy: tolerates big prompts)
    # This keeps pro's cost/latency ONLY on the rare heavy call; everything else stays on flash. A
    # SMALL synthesis (little evidence) still rides the light model — it's load-driven, not per-node.
    # The NORMAL chat path (e.g. Ask answering a hard reasoning puzzle) still uses the global
    # `primary` (pro) directly. null `model` = use primary; null `heavy_model` = no heavy routing.
    model: deepseek-v4-flash:cloud           # LIGHT — default for all small DR calls
    heavy_model: deepseek-v4-pro:cloud       # HEAVY — large-payload calls (e.g. synthesis)
    heavy_threshold_chars: 250000            # prompt chars at/above which -> heavy_model
                                             # (synthesis ~596K >> 250K; next-biggest call ~139K < 250K)
    # Phase 0 (orchestration retrofit): before researching, LLM-extract the RESEARCH-and-writing
    # intent from a possibly-compound request, stripping delivery/packaging directives (generate
    # PDF/HTML, save file, email, post to social/publishing) and recipient addresses. The research
    # + synthesis stages must produce the CONTENT only; delivery is handled downstream by POST-LLM
    # execution / the orchestrator. This prevents the synthesizer from refusing a whole task because
    # it "cannot send email / create PDFs". false = pass the raw request through (legacy behavior).
    normalize_request: true
    # Phase 2 delivery fan-out (gated by the trusted-client allow_delivery flag). After research,
    # decomposed actions (render PDF, email, …) are executed by directly dispatching existing tools.
    delivery:
      # Local deliverables in sandbox_workspace are KEPT after sending (and always kept on failure),
      # then a best-effort TTL sweep purges files older than this many hours so disk stays bounded.
      retention_hours: 72
      # Phase 3 — DYNAMIC ACTION DISPATCH (open-vocabulary tool integration, Principle 6).
      # The decomposer already emits an OPEN action vocabulary grounded in the live tool catalog
      # (any registered tool, not a fixed enum). With this ON, RAICA dispatches EVERY such action
      # generically: for each action whose `type` resolves to a real tool, an LLM "arg-binder" call
      # is shown that tool's FULL parameter schema + the research output + the user's intent + the
      # results of prior actions (sequential, dependency-aware), and returns the exact arguments;
      # RAICA then runs the tool via safe_function_call. New tools need ZERO code here (Generalization
      # Test). The proven file+email secure pipeline (recipient-locking, doc-fail-blocks-email) is
      # UNCHANGED and runs after the generic pass. false = legacy: only file+email are wired, other
      # actions are reported "not wired yet".
      dynamic_dispatch: true
      # Max output tokens for each arg-binder LLM call (it returns a small JSON arguments object).
      binder_max_tokens: 1500
      # Per-action dispatch hard timeout (seconds) so one slow/hung tool can't stall the whole run.
      action_timeout_seconds: 180
      # How many chars of the research output to show the arg-binder as shared context (it can also
      # use the literal "{{RESEARCH_OUTPUT}}" placeholder for any field that should carry the FULL
      # paper verbatim — RAICA substitutes it before dispatch, so the LLM never retypes the paper).
      context_char_budget: 12000
    retry:
      # Resilience for transient upstream LLM-provider 5xx errors (e.g. Ollama-cloud "500 Internal
      # Server Error"). Deep research is a long, resource-heavy operation; rather than fail a run on a
      # transient blip, RETRY the failed LLM call up to max_attempts, waiting delay_seconds between
      # tries (gives the provider time to recover). Applies ONLY to 5xx; other errors fail fast.
      # If all attempts fail, the user is told the model is temporarily unavailable (try again later).
      # Tuned to fit under client read-timeouts: each silent wait (delay_seconds) must stay below the
      # client's read timeout (NewX @Ask = 900s; OpenWebUI default shorter). 3 attempts × 120s = 2
      # recovery chances, each 120s gap well under those limits.
      max_attempts: 3
      delay_seconds: 120
    output:
      # Clients that want only the clean answer can suppress the framing.
      stream_progress: false        # live "> Planning… > Round k…" lines + the Deep Research header
      include_audit_footer: true   # the "### 🔎 Research Audit" footer (sources/credibility/claims)
    planner:
      # LLM decomposes a research request into sub-questions + per-question source
      # strategy. max_sub_questions caps planner breadth; the LLM proposes fewer when apt.
      max_sub_questions: 6
    loop:
      # Iterative gather loop ceilings (LLM proposes within these; RAICA clamps).
      max_rounds_ceiling: 4
      wall_clock_seconds: 240
    sources:
      # Tool names (must exist in AsyncToolManager.available_functions) the planner may
      # choose from. The LLM picks per sub-question; RAICA only dispatches what's listed.
      allowed:
        - search_web
        - get_news_summaries
        - wikipedia_query
        - published_papers_search
        - get_sec_filings
        - document_search
    # ---- Stage 2: synthesis, verification, arbitration ----
    synthesis:
      # Grounded draft from the evidence pool. Credibility-aware: scholarly claims must
      # lean on higher-tier sources; low-tier sources are reported as "claimed by X".
      credibility_grading: true
      # SOURCE PROVENANCE (primary-vs-secondary) — docs/RAICA_SOURCE_PROVENANCE.md. Phase 0 wires ONLY
      # the shadow role-grading + logging (a baseline; ZERO answer change — roles are logged, not fed to
      # synthesis). Later phases flip prefer_primary (synthesis prefers the primary in evidence),
      # chase_primary (gather loop seeks the origin for secondary-only claims), and corroboration/footer
      # flags. All fail-open; set enabled:false to fully disable.
      source_provenance:
        enabled: true
        shadow: true                     # Phase 0: compute + log only
        prefer_primary: false            # Phase 1
        chase_primary: false             # Phase 2
        corroboration_elevates: false    # Phase 3
        min_independent_secondaries: 2   # the "multiple witnesses" threshold
        flag_single_secondary: false     # Phase 3
      # A deep run can gather >1MB of evidence, overflowing the model context window.
      # The evidence fed to each LLM call is budgeted to this many TOKENS (measured with
      # tiktoken), shared fairly across sources (small sources kept whole, leftover given
      # to large ones, which are truncated only if needed). Keep below the model window
      # (context_window_size, 200000 tokens) minus headroom for instructions + the generated answer.
      # Raised 110000 -> 160000 (+45%) to retain more evidence on large research runs.
      evidence_token_budget: 160000
      # Max tokens for the generated answer. Deep research has rich evidence to draw on;
      # give the model room to elaborate fully (kept well within the model window).
      max_answer_tokens: 16000   # 8000 - 16000 (8000 truncated drafts mid-output — see 2026-06-01 test)
      # Two-pass enumeration: for LIST/TABLE/"earliest/all" requests, first extract the COMPLETE
      # item roster from a breadth-first view of ALL evidence (before token-budget truncation can
      # drop boundary items), then synthesize a row for every item. Fixes enumeration-completeness
      # gaps (e.g. a "earliest civilizations" table that dropped the Neolithic cultures because
      # their evidence got truncated). Detection + roster are best-effort: on disable or ANY
      # failure, synthesis falls back to the normal single-pass path (no behavior change for
      # non-enumeration queries).
      enumeration_two_pass: true
    verification:
      enabled: true
      # A claim needs at least this many independent sources to be labeled "supported".
      min_corroborating_sources: 2
      # Output token budget for the verification JSON (maps to Ollama num_predict via
      # research/_collect_stream). A long answer yields a large claim list; the salvage parser
      # recovers complete claims if the JSON is still cut off, so verify never returns 0.
      max_tokens: 16000
      # Token budget for the EVIDENCE document sent to the verifier. Kept well below the full
      # synthesis budget so the verify INPUT does not fill the context window and starve the
      # output. Raised 60000 -> 87000 (+45%) alongside the larger context window (200000).
      evidence_token_budget: 87000
      # Model that EXTRACTS + VERIFIES claims against the evidence. null = primary.
      # More mechanical than arbitration, so a lower quality-risk place to use a faster model.
      # NOTE (2026-06-01 test): gemma4:31b here checked half as many claims (13 vs 26) and
      # flagged none (rubber-stamped all 'supported') vs deepseek catching an unverified one.
      # ~19s faster but weakened the hallucination safety net — keep at null.
      verify_model: null # setting it to null will default to primary model
    arbitration:
      # Run synthesis on multiple models and reconcile disagreements. Set enabled:false
      # to skip the extra model cost (single-model synthesis still gets verified).
      #
      # DISABLED (2026-06-01): the reconcile step received the drafts but NOT the evidence
      # pool, so its "enrich/preserve against the evidence" instructions were impossible to
      # follow — it collapsed two rich evidence-grounded drafts (~31-33K chars) to ~21K.
      # Two-model arbitration only pays off when the draft models are PEERS in depth/breadth;
      # deepseek-v4-pro and gpt-oss-120b are not. So we now do single-model synthesis on the
      # primary (full evidence in-context) + verification. Revisit only with on-par models.
      enabled: false
      models:
        - deepseek-v4-pro:cloud
        - gpt-oss:120b-cloud
      # Model that RECONCILES the drafts. null = use the primary model (deepseek-v4-pro).
      # The reconcile step is the heaviest Stage-2 LLM call AND the hardest reasoning
      # (long-context merge + conflict detection), so trading it to a smaller/faster model
      # is a speed-vs-quality experiment — measure both. Set back to null to revert.
      # NOTE (2026-06-01 test): gemma4:31b here cut the final answer ~55% (9.7K vs 21K chars)
      # — it summarized instead of merging, killing the elaboration goal. Keep at null.
      arbitration_model: null   # setting it to null will default to primary model

# ============================================================================
# CONTEXT-AND-ACTION SUBSTRATE CONVERGENCE (docs/RAICA_CONTEXT_SUBSTRATE_CONVERGENCE.md)
# ============================================================================
convergence:
  # Phase 2 — SHADOW-MODE LLM intent classifier. When enabled, an LLM intent classifier runs
  # ALONGSIDE the legacy keyword classifier (_verify_task_completion) on each verified request, and
  # the two results are compared and logged. The legacy result stays AUTHORITATIVE — this is purely
  # observational (zero behavior change), to gather real-traffic divergence data before Phase 3 cuts
  # intent classification over to the LLM. The shadow runs as a NON-BLOCKING background task, so it
  # never adds latency to the user's response.
  shadow_classifier:
    enabled: false              # master switch — turn on to collect divergence data
    sample_rate: 1.0            # fraction of eligible requests to shadow (0.0–1.0) to bound cost
    model: deepseek-v4-flash:cloud   # light/cheap model for the classification call (null = primary)
    max_prompt_chars: 8000      # skip shadowing requests whose prompt exceeds this (cost guard)
    max_tokens: 800             # output cap for the classifier JSON
    timeout_seconds: 60         # hard timeout for the background shadow call
    # Disagreements are appended (best-effort) as JSONL here for offline analysis; every shadow run
    # also emits a "🕵️ SHADOW CLASSIFIER" log line. Empty/null = log only (no file).
    divergence_log: logs/shadow_classifier_divergence.jsonl
  # Phase 3c — AUTHORITATIVE LLM intent classifier (the cutover). When mode=llm, the LLM intent
  # classifier (orchestration/intent.py) replaces the legacy keyword classifier for the
  # post-generation delivery decision AND the tool selection (FULL tool set). The legacy classifier is
  # ALWAYS still computed and is the FALLBACK on LLM error/timeout/over-length. mode=legacy (default)
  # keeps the legacy classifier authoritative — i.e. shipping this changes NOTHING until you flip it.
  # Baseline (v1.0.0.84): LLM delivery-decision 100% stable vs legacy 71.9%; exact-tool stability 93.8%.
  # NOTE: the POST-LLM executor natively dispatches file + email + social_media_* (publish); other LLM
  # tool picks (e.g. image/chart) await Phase 4 generic dispatch.
  intent_classifier:
    mode: llm                        # legacy | llm  [VALIDATION on dev: prompt hardened vs system-directive bias, 2026-06-06]
    model: deepseek-v4-flash:cloud   # classifier model (null = primary)
    max_tokens: 800
    timeout_seconds: 30              # exceeded → legacy fallback
    max_prompt_chars: 12000          # over this → legacy fallback (latency/cost guard)

code_generation:
  # ============================================================
  # MODEL SELECTION - Change this ONE value to switch models
  # ============================================================
  selected_model: deepseek-v4-pro:cloud

  # Classification model override (for tasks requiring strict JSON output)
  # Kimi is great at code generation but returns thinking tags instead of pure JSON
  # Use a model that reliably returns JSON for classification/orchestration tasks
  classification_model: gpt-oss:120b-cloud  # qwen3-next requires reasoning_effort param; qwen3-coder:480b-cloud sometimes 503

  # Available model presets (friendly name → provider + model)
  model_presets:
    # OpenAI models
    gpt-4o:
      provider: openai
      model: gpt-4o
    gpt-4o-mini:
      provider: openai
      model: gpt-4o-mini
    gpt-4-turbo:
      provider: openai
      model: gpt-4-turbo
    # Anthropic Claude models
    claude-sonnet:
      provider: anthropic
      model: claude-sonnet-4-20250514
    claude-opus:
      provider: anthropic
      model: claude-opus-4-20250514
    # Google Gemini models
    gemini-flash:
      provider: gemini
      model: gemini-2.0-flash
    gemini-pro:
      provider: gemini
      model: gemini-2.5-pro
    # Ollama local models
    Kimi-k2.5:
      provider: ollama
      model: Kimi-k2.5:cloud
    gpt-oss-20b:
      provider: ollama
      model: gpt-oss:20b-cloud
    gpt-oss-120b:
      provider: ollama
      model: gpt-oss:120b-cloud
    glm-4.7:
      provider: ollama
      model: glm-4.7:cloud
    deepseek-v3:
      provider: ollama
      model: deepseek-v3.1:671b-cloud
    qwen-coder:
      provider: ollama
      model: qwen3-coder:480b-cloud
    ministral-3:14b:
      provider: ollama
      model: ministral-3:14b-cloud
    qwen3-coder-next:
      provider: ollama
      model: qwen3-coder-next:cloud

  # Fallback order (used when selected model fails)
  fallback:
    enabled: true
    order:
      # Best models first - automatic fallback chain
      - provider: ollama
        model: gpt-oss:120b-cloud
      - provider: ollama
        model: qwen3-coder:480b-cloud
      - provider: openai
        model: gpt-4o
      - provider: anthropic
        model: claude-sonnet-4-20250514
      - provider: openai
        model: gpt-4o-mini
      - provider: gemini
        model: gemini-2.0-flash
      - provider: ollama
        model: deepseek-v3.1:671b-cloud
      - provider: ollama
        model: qwen3-coder:480b-cloud

  # Provider configurations (credentials and settings)
  providers:
    openai:
      model: gpt-4o
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      timeout: 300
      temperature: 0.0
      max_tokens: 16384
      retry_attempts: 3
      retry_delay: 2
    anthropic:
      model: claude-sonnet-4-20250514
      api_key: ${ANTHROPIC_API_KEY}
      base_url: https://api.anthropic.com
      timeout: 300
      temperature: 0.0
      max_tokens: 16384
      retry_attempts: 3
      retry_delay: 2
    gemini:

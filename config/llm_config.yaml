debug:
  log_requests: false
  log_timing: true
  mock_providers: false
document_interrogator:
  integrity:
    corruption_threshold: 0.05
    embedding_consistency_min_cosine: 0.999
    auto_rebuild:
      max_per_window: 2
      window_hours: 24
  max_files_per_scan: 400
  scan_interval_minutes: 60
  auto_watch_enabled: false
  startup_initialization_delay: 3
  embedding:
    provider: openai
    model_name: text-embedding-3-small
    dimension: 1024
    service:
      base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}
    timeout:
      embedding_request: 30
      health_check: 10
    retry:
      max_attempts: 3
      retry_delay_seconds: 2
    batch_processing:
      batch_size: 50
      batch_delay_seconds: 1.0
      adaptive_mode_enabled: true
      min_batch_size: 1
      adaptive_reduction_factor: 0.5
      max_recovery_cycles: 3
  document_processing:
    chunk_size: 400
    chunk_overlap: 50
    min_chunk_length: 10
    max_chunk_length: 500
  scaling_notes: "SCALING GUIDELINES (based on empirical research):\n\nCurrent configuration\
    \ optimal for: 1K-10K documents (10K-100K chunks)\n\nScaling to 100K+ chunks:\n\
    \  1. Reduce dimension: 1024 \u2192 768 (switch to nomic-embed-text, 33% storage\
    \ savings)\n  2. Implement quantization: FP16 (48% memory reduction) or binary\
    \ (32x reduction)\n  3. Consider separate FAISS instances per document collection\n\
    \nModel choice at scale:\n  - <10K chunks: mxbai-embed-large (current, optimal\
    \ quality)\n  - 10K-100K chunks: Keep mxbai OR switch to nomic for speed\n  -\
    \ 100K-1M chunks: Consider E5-small (384d) or BGE (768d)\n  - 1M+ chunks: Plan\
    \ for distributed embedding service\n\nEmbedding service bottleneck analysis:\n\
    \  - Batch size 25 \xD7 250 tokens/chunk = 6250 tokens/batch \u2192 OOM after\
    \ 1650 vectors\n  - Batch size 10 \xD7 250 tokens/chunk = 2500 tokens/batch \u2192\
    \ Sustainable at scale\n  - Time: 27-30 min for 1961 chunks with batch_size=10\n"
llm:
  fallback:
    auto_switch: true
    enabled: true
    order:
    - ollama
    - openai
    - openrouter
    - qwen
    - gemini
  primary:
    type: ollama
    config:
      model: deepseek-v4-pro:cloud
      api_key: "ollama"   # CONVERTED -> ollama (was ${DEEPINFRA_API_KEY})
      base_url: http://127.0.0.1:11434
      timeout: 1200
      temperature: 0.7
      max_tokens: 32768
      context_window_size: 200000
      stream: true
      think: false
  tool_calling:
    type: ollama
    config:
      model: glm-5.2:cloud
      timeout: 600
      temperature: 0.1
      max_tokens: 8192
      stream: true
  providers:
    ollama:
      base_url: http://127.0.0.1:11434
      health_check_url: http://127.0.0.1:11434/api/tags
      retry_attempts: 3
      retry_delay: 2
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      organization: null
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gpt-4o-mini
        tool_calling: gpt-4o-mini
    openrouter:
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      retry_attempts: 3
      retry_delay: 1
      headers:
        HTTP-Referer: ${OPENROUTER_SITE_URL}
        X-Title: ${OPENROUTER_SITE_NAME}
      models:
        primary: deepseek/deepseek-r1
        tool_calling: openai/gpt-4o-mini
        reasoning: deepseek/deepseek-r1
        free: openai/gpt-oss-20b:free
    deepinfra:
      api_key: ${DEEPINFRA_API_KEY}
      base_url: https://api.deepinfra.com/v1/openai
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: deepseek-ai/DeepSeek-V3.1
        tool_calling: zai-org/GLM-5.2
        reasoning: deepseek-ai/DeepSeek-R1-0528
        vision: Qwen/Qwen3-VL-235B-A22B-Instruct
        cheap: meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo
    gemini:
      api_key: ${GEMINI_API_KEY}
      model: gemini-flash-latest
      timeout: 120
      temperature: 0.7
      max_tokens: 8192
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gemini-flash-latest
        pro: gemini-pro-latest
        flash: gemini-flash-latest
        stable_flash: gemini-2.5-flash
        stable_pro: gemini-2.5-pro
performance:
  connection_pool_size: 10
  max_concurrent_requests: 5
  request_timeout: 1200
  streaming_chunk_size: 1024
lookup_website:
  max_article_chars: 10000
  max_data_bytes: 2000000
tool_calling:
  gather_gate:
    enabled: false
    shadow: true
    assess_max_tokens: 2000
    max_gather_rounds: 3
    wall_clock_seconds: 90
    model: null
  second_round:
    enabled: true
    max_extra_rounds: 1
    max_chars_per_tool: 100000
    max_chars_total: 200000
    selector_max_tokens: 16384
platform:
  config_dir:
    linux: ${HOME}/.config/agentic_rag
    macos: ${HOME}/.config/agentic_rag
    windows: ${APPDATA}/agentic_rag
  log_dir:
    linux: ${HOME}/.local/share/agentic_rag/logs
    macos: ${HOME}/.local/share/agentic_rag/logs
    windows: ${LOCALAPPDATA}/agentic_rag/logs
  temp_dir:
    linux: /tmp/agentic_rag
    macos: ${TMPDIR}/agentic_rag
    windows: ${TEMP}/agentic_rag
security:
  api_key_encryption: false
  audit_logging: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_limit: 10
arbitrator:
  # SI-079 — RESTORED. `enabled` is what manager.py:127 reads to build the provider at all
  #   (`arbitrator_config.get('enabled', False)`), so its ABSENCE silently disables the lane.
  # It was dropped by d07ec70 (v1.0.0.297) when this block was reverted from DeepInfra back
  # to Ollama — the revert reinstated an older block that never had the key. Result: every
  # `call_arbitrator` raised on local AND live from v297 onward, which killed plot_data's
  # post-LLM dispatch (it generates the tool's parameters via the arbitrator) and left
  # `🧠 Arbitrator disabled - skipping arbitrator provider` in the startup log as the only
  # notice. Do not remove: a missing key here fails CLOSED and silently.
  enabled: true
  type: ollama
  config:
    model: glm-5.2:cloud
    timeout: 600
    temperature: 0.1
    max_tokens: 4096
    stream: true
optimization:
  enabled: true
  rollout_percentage: 100.0
  detailed_logging: true
non_dr:
  citation_grounding:
    enabled: true
    shadow: true
  search_article_guard:
    enabled: true
deep_research:
  enabled: true
  search:
    web_max_results: 8
    per_page_char_budget: 6000
    per_page_max_blocks: 12
  citation_verify:
    enabled: true
    timeout_seconds: 6
    max_workers: 8
  research_classifier:
    enabled: true
  data_charts:
    enabled: false
    sources:
      allowed:
      - world_bank
      - fbi_cde
      - fred
      catalog:
        fred:
          tier: structured_api
          source_name: "FRED \u2014 Federal Reserve Bank of St. Louis"
          home_url: https://fred.stlouisfed.org/
          title_template: "U.S. {label}, {x_min}\u2013{x_max}"
          endpoint: https://api.stlouisfed.org/fred/series/observations
          auth:
            type: query_key
            param: api_key
            env:
            - FRED_API_KEY
            - FRED_API_KEY_RAICABAKER
          params:
            series_id: '{measure_path}'
            file_type: json
            observation_start: '{from_year}-01-01'
            observation_end: '{to_year}-12-31'
          shape: fred_observations
          geo_label: United States
          min_year: 1947
          coverage: "varies by series (mostly 1947\u2013present); aggregated to annual"
          value_kinds:
          - value
          x:
            field:
            - year
            type: temporal
            name: year
          value:
            field:
            - value
          methodology: FRED series, aggregated to annual means from the published
            frequency.
          discovery:
            type: fred_search
            search_endpoint: https://api.stlouisfed.org/fred/series/search
            limit: 12
          note: "DISCOVERY ENABLED: the measures below are common shortcuts, but you\
            \ may also set `measure` to a plain DESCRIPTION of ANY U.S. economic /\
            \ financial / housing / labor / demographic series (e.g. \"Case-Shiller\
            \ home price index\", \"homeownership rate\", \"30-year mortgage rate\"\
            , \"real median house price\") or a FRED series id \u2014 the tool searches\
            \ FRED and resolves the single best real series, reporting which id +\
            \ coverage it used. For a LONG history, describe the underlying quantity\
            \ (e.g. \"home price index\", available since 1987) rather than a derived\
            \ index that may only be recent."
          measures:
            unemployment:
              label: unemployment rate
              path: UNRATE
              unit: '% of labor force'
            labor-force-participation:
              label: labor force participation rate
              path: CIVPART
              unit: '%'
            inflation-cpi:
              label: consumer price index (CPI)
              path: CPIAUCSL
              unit: index 1982-84=100
            gdp:
              label: GDP
              path: GDP
              unit: billions of US$
            debt-to-gdp:
              label: federal debt as % of GDP
              path: GFDEGDQ188S
              unit: '% of GDP'
            gdp-per-capita:
              label: real GDP per capita
              path: A939RX0Q048SBEA
              unit: chained 2017 US$
            dollar-index:
              label: trade-weighted US dollar index
              path: DTWEXBGS
              unit: index Jan 2006=100
            net-exports:
              label: net exports (trade balance)
              path: NETEXP
              unit: billions of US$
            nonfarm-payrolls:
              label: total nonfarm employment
              path: PAYEMS
              unit: thousands of persons
            fed-funds-rate:
              label: federal funds rate
              path: FEDFUNDS
              unit: '%'
            mortgage-30yr:
              label: 30-year fixed mortgage rate
              path: MORTGAGE30US
              unit: '%'
            median-household-income:
              label: real median household income
              path: MEHOINUSA672N
              unit: constant US$
            income-inequality-gini:
              label: income Gini ratio (families)
              path: GINIALLRF
              unit: Gini ratio
        fbi_cde:
          tier: structured_api
          source_name: FBI UCR / Crime Data Explorer
          home_url: https://cde.ucr.cjis.gov/
          title_template: "U.S. {label} {value_kind}, {x_min}\u2013{x_max}"
          endpoint: https://api.usa.gov/crime/fbi/cde/summarized/national/{measure_path}
          auth:
            type: query_key
            param: API_KEY
            env:
            - FBI_CDE_API_KEY
            - DATA_GOV_API_KEY
          params:
            type: counts
            from: 01-{from_year}
            to: 12-{to_year}
          shape: fbi_cde_summarized
          geo_label: US-national
          min_year: 1985
          fetch_timeout_seconds: 28
          fetch_retries: 5
          fetch_retry_backoff_seconds: 1.0
          coverage: "~1985\u2013present (monthly, aggregated to annual)"
          value_kinds:
          - rate
          - count
          x:
            field:
            - year
            - data_year
            type: temporal
            name: year
          value:
            field:
            - rate
            - rate_per_100000
            count_field:
            - count
            - actual
            - value
            - estimate
            unit_rate: per 100,000
            unit_count: offenses
          methodology: "FBI UCR Crime Data Explorer, national summarized offenses;\
            \ monthly values summed to annual (complete years only). NOTE: the FBI\
            \ retired the Summary Reporting System (SRS) and moved to NIBRS-only on\
            \ 2021-01-01; 2021 agency participation fell to ~63% (vs ~95%+ under SRS),\
            \ so 2021 and the SRS\u2194NIBRS boundary are less comparable to prior\
            \ years (FBI resumed accepting both systems in 2022)."
          discontinuities:
          - at: 2021
            requires_span: true
            note: "SRS\u2192NIBRS transition \u2014 2021 coverage ~63% (vs ~95%+),\
              \ less comparable to prior years"
          measures:
            violent-crime:
              label: violent crime
              path: violent-crime
            homicide:
              label: homicide
              path: homicide
            rape:
              label: rape
              path: rape
            robbery:
              label: robbery
              path: robbery
            aggravated-assault:
              label: aggravated assault
              path: aggravated-assault
            property-crime:
              label: property crime
              path: property-crime
            burglary:
              label: burglary
              path: burglary
            larceny:
              label: larceny-theft
              path: larceny
            motor-vehicle-theft:
              label: motor vehicle theft
              path: motor-vehicle-theft
            arson:
              label: arson
              path: arson
        world_bank:
          tier: structured_api
          source_name: World Bank Open Data
          home_url: https://data.worldbank.org/
          title_template: "{label} ({geo}), {x_min}\u2013{x_max}"
          endpoint: https://api.worldbank.org/v2/country/{geo_path}/indicator/{measure_path}?format=json&per_page=20000
          auth:
            type: none
          params:
            date: '{from_year}:{to_year}'
          shape: worldbank
          geo_default: USA
          geo_resolver: iso3
          geo_hint: country name OR ISO-3166 code (e.g. Egypt/EGY, United States/USA,
            China/CHN; WLD=world; default USA)
          discovery:
            type: wb_search
            base: https://api.worldbank.org/v2
            min_score: 1.5
          note: "DISCOVERY ENABLED: the measures below are shortcuts, but you may\
            \ reach ANY World Bank indicator. PREFER giving the exact WB indicator\
            \ CODE \u2014 you know these (e.g. FP.CPI.TOTL.ZG = CPI inflation, SL.UEM.TOTL.ZS\
            \ = unemployment, EG.ELC.ACCS.ZS = electricity access, SP.DYN.LE00.IN\
            \ = life expectancy, IT.NET.USER.ZS = internet users) \u2014 a code is\
            \ resolved EXACTLY. You may instead pass a plain description, but WB has\
            \ no search ranking so that is BEST-EFFORT (the tool reports which indicator\
            \ it picked; verify it matches the intent) and fails closed if uncertain.\
            \ Use the code whenever you know it."
          coverage: "1960\u2013present (varies by indicator)"
          value_kinds:
          - value
          x:
            field:
            - date
            type: temporal
            name: year
          value:
            field:
            - value
          measures:
            population:
              label: population
              path: SP.POP.TOTL
              unit: people
            gdp:
              label: GDP (current US$)
              path: NY.GDP.MKTP.CD
              unit: current US$
            gdp-per-capita:
              label: GDP per capita (current US$)
              path: NY.GDP.PCAP.CD
              unit: current US$
            co2-per-capita:
              label: "CO\u2082 emissions per capita"
              path: EN.GHG.CO2.PC.CE.AR5
              unit: "t CO\u2082e per capita"
            co2-total:
              label: "CO\u2082 emissions (total)"
              path: EN.GHG.CO2.MT.CE.AR5
              unit: "Mt CO\u2082e"
            life-expectancy:
              label: life expectancy at birth
              path: SP.DYN.LE00.IN
              unit: years
            unemployment:
              label: unemployment rate
              path: SL.UEM.TOTL.ZS
              unit: '% of labor force'
            inflation:
              label: inflation (CPI)
              path: FP.CPI.TOTL.ZG
              unit: '% annual'
    max_per_response: 4
    fetch_timeout_seconds: 10
    fetch_retries: 4
    fetch_retry_backoff_seconds: 0.5
    render:
      width_px: 760
      height_px: 430
  engine:
    enabled: true
    citation_grounding:
      enabled: true
      shadow: true
      on_unsourced: flag
      verify_live:
        enabled: true
        shadow: false
        timeout_seconds: 6
        max_workers: 8
    retrieval_audit:
      enabled: true
      min_body_chars: 200
    decompose_max_tokens: 4000
    verification:
      max_tokens: 32000
      enabled: true
      min_corroborating_sources: 2
      evidence_token_budget: 87000
      verify_model: null
    model: deepseek-v4-flash:cloud
    heavy_model: deepseek-v4-pro:cloud
    heavy_threshold_chars: 20000
    normalize_request: true
    delivery:
      retention_hours: 72
      dynamic_dispatch: true
      binder_max_tokens: 1500
      action_timeout_seconds: 180
      context_char_budget: 12000
    retry:
      max_attempts: 3
      delay_seconds: 120
    output:
      stream_progress: false
      include_audit_footer: true
    planner:
      max_sub_questions: 6
      max_tokens: 4000
      per_source_queries: true
      gather_quality:
        enabled: true
    loop:
      max_rounds_ceiling: 4
      # Budget for the WHOLE gather loop. NOTE: it is evaluated between rounds, so it cannot
      # interrupt work inside one — that is what dispatch_timeout_seconds below is for.
      wall_clock_seconds: 240
      # Seconds a SINGLE source may take before it is abandoned and the round continues
      # without it. Bounds a HUNG source, never a lengthy request: a long research run may
      # still take as many rounds as its own budget allows.
      #
      # DERIVED, not chosen. Measured round durations across every archived run were 15-46s
      # (the widest round dispatched 48 sources in parallel and took 45s), and a round's wall
      # time is ~its slowest task. A realistic bounded worst case for one source is ~60-90s
      # (search_web: 6 engines x 5s + ~3 extractions x 10s).
      #
      # MUST STAY BELOW wall_clock_seconds. A per-source budget larger than the loop's own
      # budget is self-contradictory: one stuck source could outlive the entire gather phase
      # it belongs to. 180s is ~4x the slowest measured round, ~2x a realistic worst case,
      # and still comfortably inside the 240s loop budget.
      #
      # Why it exists: on 2026-08-17 one source stopped returning and froze a production DR
      # round for 41 minutes — silently, at ~98% idle CPU, with zero LLM calls in the
      # provider's own journal. wall_clock_seconds could not fire because the loop never got
      # back to its check.
      dispatch_timeout_seconds: 180
      assess_max_tokens: 4000
    sources:
      allowed:
      - search_web
      - get_news_summaries
      - wikipedia_query
      - published_papers_search
      - get_sec_filings
      - document_search
      - comprehensive_stock_analyzer
      - get_stock_and_company_data
    synthesis:
      credibility_grading: true
      retrieval_gate:
        enabled: true
        shadow: false
      adversarial_balance:
        enabled: true
      source_provenance:
        enabled: true
        shadow: true
        prefer_primary: false
        chase_primary: false
        corroboration_elevates: false
        min_independent_secondaries: 2
        flag_single_secondary: false
      source_relevance:
        enabled: true
        shadow: true
        domain_fit_judge: true
      evidence_token_budget: 160000
      priority_sources:
      - comprehensive_stock_analyzer
      - get_stock_and_company_data
      priority_budget_ceiling: 0.7
      max_answer_tokens: 32000
      enumeration_two_pass: true
      chart_completeness:
        enabled: true
        max_repair_passes: 3
        min_content_ratio: 0.85
    arbitration:
      enabled: false
      models:
      - deepseek-v4-pro:cloud
      - gpt-oss:120b-cloud
      arbitration_model: null

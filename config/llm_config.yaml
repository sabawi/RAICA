debug:
  log_requests: false
  log_timing: true
  mock_providers: false
document_interrogator:
  max_files_per_scan: 400
  scan_interval_minutes: 60
  auto_watch_enabled: false
  startup_initialization_delay: 3
  embedding:
    model_name: mxbai-embed-large
    dimension: 1024
    service:
      host: 127.0.0.1
      port: 11434
      base_url: http://127.0.0.1:11434
      health_check_timeout_seconds: 10
    timeout:
      embedding_request: 120
      service_restart: 5
      health_check: 10
    retry:
      max_service_restart_attempts: 3
      retry_delay_seconds: 3
    batch_processing:
      batch_size: 15
      batch_delay_seconds: 4.0
      adaptive_mode_enabled: true
      min_batch_size: 1
      adaptive_reduction_factor: 0.5
  document_processing:
    chunk_size: 400
    chunk_overlap: 50
    min_chunk_length: 10
    max_chunk_length: 500
  scaling_notes:
    "SCALING GUIDELINES (based on empirical research):\n\nCurrent configuration\
    \ optimal for: 1K-10K documents (10K-100K chunks)\n\nScaling to 100K+ chunks:\n\
    \  1. Reduce dimension: 1024 \u2192 768 (switch to nomic-embed-text, 33% storage\
    \ savings)\n  2. Implement quantization: FP16 (48% memory reduction) or binary\
    \ (32x reduction)\n  3. Consider separate FAISS instances per document collection\n\
    \nModel choice at scale:\n  - <10K chunks: mxbai-embed-large (current, optimal\
    \ quality)\n  - 10K-100K chunks: Keep mxbai OR switch to nomic for speed\n  -\
    \ 100K-1M chunks: Consider E5-small (384d) or BGE (768d)\n  - 1M+ chunks: Plan\
    \ for distributed embedding service\n\nEmbedding service bottleneck analysis:\n\
    \  - Batch size 25 \xD7 250 tokens/chunk = 6250 tokens/batch \u2192 OOM after\
    \ 1650 vectors\n  - Batch size 10 \xD7 250 tokens/chunk = 2500 tokens/batch \u2192\
    \ Sustainable at scale\n  - Time: 27-30 min for 1961 chunks with batch_size=10\n"
llm:
  fallback:
    auto_switch: true
    enabled: true
    order:
      - ollama
      - openai
      - openrouter
      - qwen
      - gemini
  primary:
    type: ollama
    config:
      model: deepseek-v3.1:671b-cloud # deepseek-v3.1:671b-cloud
      timeout: 600
      temperature: 0.7
      max_tokens: 16384
      context_window_size: 16384
      stream: true
      think: false  # Disable thinking/reasoning output (saves tokens, faster responses)
  tool_calling:
    type: openai
    config:
      model: qwen3.5:397b-cloud
      timeout: 120
      context_window_size: 4096
      temperature: 0.1
      max_tokens: 1024
      stream: false
      api_key: "ollama"
      base_url: http://127.0.0.1:11434/v1
  providers:
    ollama:
      base_url: http://127.0.0.1:11434
      health_check_url: http://127.0.0.1:11434/api/tags
      retry_attempts: 3
      retry_delay: 2
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      organization: null
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gpt-4o
        tool_calling: gpt-4o
    openrouter:
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      retry_attempts: 3
      retry_delay: 1
      headers:
        HTTP-Referer: ${OPENROUTER_SITE_URL}
        X-Title: ${OPENROUTER_SITE_NAME}
      models:
        primary: deepseek/deepseek-r1:free
        tool_calling: openai/gpt-4o-mini
        reasoning: deepseek/deepseek-r1
        free: deepseek/deepseek-r1:free
    gemini:
      api_key: ${GEMINI_API_KEY}
      model: gemini-flash-latest
      timeout: 120
      temperature: 0.7
      max_tokens: 8192
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gemini-flash-latest
        pro: gemini-pro-latest
        flash: gemini-flash-latest
        stable_flash: gemini-2.5-flash
        stable_pro: gemini-2.5-pro
performance:
  connection_pool_size: 10
  max_concurrent_requests: 5
  request_timeout: 1200
  streaming_chunk_size: 1024
platform:
  config_dir:
    linux: ${HOME}/.config/agentic_rag
    macos: ${HOME}/.config/agentic_rag
    windows: ${APPDATA}/agentic_rag
  log_dir:
    linux: ${HOME}/.local/share/agentic_rag/logs
    macos: ${HOME}/.local/share/agentic_rag/logs
    windows: ${LOCALAPPDATA}/agentic_rag/logs
  temp_dir:
    linux: /tmp/agentic_rag
    macos: ${TMPDIR}/agentic_rag
    windows: ${TEMP}/agentic_rag
security:
  api_key_encryption: false
  audit_logging: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_limit: 10
arbitrator:
  enabled: true
  type: openai
  config:
    model: qwen3.5:397b-cloud
    timeout: 60
    context_window_size: 4096
    temperature: 0.1
    max_tokens: 1024
    stream: false
    api_key: "ollama"
    base_url: http://127.0.0.1:11434/v1
optimization:
  enabled: true
  rollout_percentage: 100.0
  detailed_logging: true
code_generation:
  # ============================================================
  # MODEL SELECTION - Change this ONE value to switch models
  # ============================================================
  selected_model: glm-4.7

  # Classification model override (for tasks requiring strict JSON output)
  # Kimi is great at code generation but returns thinking tags instead of pure JSON
  # Use a model that reliably returns JSON for classification/orchestration tasks
  classification_model: gpt-oss:120b-cloud  # qwen3-next requires reasoning_effort param; qwen3-coder:480b-cloud sometimes 503

  # Available model presets (friendly name → provider + model)
  model_presets:
    # OpenAI models
    gpt-4o:
      provider: openai
      model: gpt-4o
    gpt-4o-mini:
      provider: openai
      model: gpt-4o-mini
    gpt-4-turbo:
      provider: openai
      model: gpt-4-turbo
    # Anthropic Claude models
    claude-sonnet:
      provider: anthropic
      model: claude-sonnet-4-20250514
    claude-opus:
      provider: anthropic
      model: claude-opus-4-20250514
    # Google Gemini models
    gemini-flash:
      provider: gemini
      model: gemini-2.0-flash
    gemini-pro:
      provider: gemini
      model: gemini-2.5-pro
    # Ollama local models
    Kimi-k2.5:
      provider: ollama
      model: Kimi-k2.5:cloud
    gpt-oss-20b:
      provider: ollama
      model: gpt-oss:20b-cloud
    gpt-oss-120b:
      provider: ollama
      model: gpt-oss:120b-cloud
    glm-4.7:
      provider: ollama
      model: glm-4.7:cloud
    deepseek-v3:
      provider: ollama
      model: deepseek-v3.1:671b-cloud
    qwen-coder:
      provider: ollama
      model: qwen3-coder:480b-cloud
    ministral-3:14b:
      provider: ollama
      model: ministral-3:14b-cloud
    qwen3-coder-next:
      provider: ollama
      model: qwen3-coder-next:cloud

  # Fallback order (used when selected model fails)
  fallback:
    enabled: true
    order:
      # Best models first - automatic fallback chain
      - provider: ollama
        model: gpt-oss:120b-cloud
      - provider: ollama
        model: qwen3-coder:480b-cloud
      - provider: openai
        model: gpt-4o
      - provider: anthropic
        model: claude-sonnet-4-20250514
      - provider: openai
        model: gpt-4o-mini
      - provider: gemini
        model: gemini-2.0-flash
      - provider: ollama
        model: deepseek-v3.1:671b-cloud
      - provider: ollama
        model: qwen3-coder:480b-cloud

  # Provider configurations (credentials and settings)
  providers:
    openai:
      model: gpt-4o
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      timeout: 300
      temperature: 0.0
      max_tokens: 16384
      retry_attempts: 3
      retry_delay: 2
    anthropic:
      model: claude-sonnet-4-20250514
      api_key: ${ANTHROPIC_API_KEY}
      base_url: https://api.anthropic.com
      timeout: 300
      temperature: 0.0
      max_tokens: 16384
      retry_attempts: 3
      retry_delay: 2
    gemini:
      model: gemini-2.0-flash
      api_key: ${GEMINI_API_KEY}
      timeout: 300
      temperature: 0.0
      max_tokens: 32768
      retry_attempts: 3
      retry_delay: 2
    ollama:
      # Single ollama config - use Kimi-k2 as default
      model: Kimi-k2.5:cloud
      base_url: http://127.0.0.1:11434
      timeout: 600
      temperature: 0.0
      max_tokens: 32768
      context_window: 32768
      retry_attempts: 2
      retry_delay: 2
      think: false  # Disable thinking/reasoning output (saves tokens, faster responses)
vision:
  type: ollama
  config:
    model: qwen3-vl:235b-cloud
    timeout: 1800
    temperature: 0.7
    max_tokens: 16384
    base_url: http://127.0.0.1:11434

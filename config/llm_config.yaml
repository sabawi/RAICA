debug:
  log_requests: false
  log_timing: true
  mock_providers: false
document_interrogator:
  # SI-042 — FAISS index integrity monitoring.
  integrity:
    # Count-mismatch / lookup-corruption tolerance before an index is called CORRUPTED.
    corruption_threshold: 0.05
    # Embedding consistency is judged by COSINE similarity between two embeddings of the
    # same text, NOT element-wise equality. Measured against prod content on
    # text-embedding-3-small: 3 of 5 samples were bit-identical, 2 differed by ~1e-4 with
    # cosine 0.999994+ — normal batched-inference jitter, semantically identical. The old
    # element-wise rtol=1e-10 flagged that as EMBEDDING_INCONSISTENCY on every boot.
    embedding_consistency_min_cosine: 0.999
    auto_rebuild:
      # THE DAMPER. An automatic rebuild reacts to a condition; if the rebuild cannot fix
      # that condition, an undamped reaction repeats every boot forever (~2 min each).
      max_per_window: 2
      window_hours: 24
  max_files_per_scan: 400
  scan_interval_minutes: 60
  auto_watch_enabled: false
  startup_initialization_delay: 3
  embedding:
    # Provider: "openai", "ollama", or any OpenAI-compatible endpoint
    # To switch back to Ollama local: set provider to "ollama" and update service below
    provider: openai
    model_name: text-embedding-3-small
    dimension: 1024
    service:
      base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}
    timeout:
      embedding_request: 30
      health_check: 10
    retry:
      max_attempts: 3
      retry_delay_seconds: 2
    batch_processing:
      batch_size: 50
      batch_delay_seconds: 1.0
      adaptive_mode_enabled: true
      min_batch_size: 1
      adaptive_reduction_factor: 0.5
      # SI-019: hard ceiling on service-recovery cycles for ONE embedding call.
      # Recovery for a cloud provider is a no-op that reports success without
      # verifying, so a permanently-failing endpoint otherwise retries forever
      # (6,614 cycles / 9.1MB of log observed 2026-08-10). Bounded here instead.
      max_recovery_cycles: 3
    # To revert to local Ollama embeddings, use this config:
    # provider: ollama
    # model_name: mxbai-embed-large
    # dimension: 1024
    # service:
    #   host: 127.0.0.1
    #   port: 11434
    #   base_url: http://127.0.0.1:11434
    # timeout:
    #   embedding_request: 120
    #   service_restart: 5
    #   health_check: 10
  document_processing:
    chunk_size: 400
    chunk_overlap: 50
    min_chunk_length: 10
    max_chunk_length: 500
  scaling_notes:
    "SCALING GUIDELINES (based on empirical research):\n\nCurrent configuration\
    \ optimal for: 1K-10K documents (10K-100K chunks)\n\nScaling to 100K+ chunks:\n\
    \  1. Reduce dimension: 1024 \u2192 768 (switch to nomic-embed-text, 33% storage\
    \ savings)\n  2. Implement quantization: FP16 (48% memory reduction) or binary\
    \ (32x reduction)\n  3. Consider separate FAISS instances per document collection\n\
    \nModel choice at scale:\n  - <10K chunks: mxbai-embed-large (current, optimal\
    \ quality)\n  - 10K-100K chunks: Keep mxbai OR switch to nomic for speed\n  -\
    \ 100K-1M chunks: Consider E5-small (384d) or BGE (768d)\n  - 1M+ chunks: Plan\
    \ for distributed embedding service\n\nEmbedding service bottleneck analysis:\n\
    \  - Batch size 25 \xD7 250 tokens/chunk = 6250 tokens/batch \u2192 OOM after\
    \ 1650 vectors\n  - Batch size 10 \xD7 250 tokens/chunk = 2500 tokens/batch \u2192\
    \ Sustainable at scale\n  - Time: 27-30 min for 1961 chunks with batch_size=10\n"
llm:
  fallback:
    auto_switch: true
    enabled: true
    order:
      - ollama
      - openai
      - openrouter
      - qwen
      - gemini
  primary:
    # LOCAL DEEPINFRA TRIAL (2026-08-15). Transport change ONLY — same model.
    # deepseek-v4-pro:cloud -> deepseek-ai/DeepSeek-V4-Pro-0813 (0813 is the build
    # Ollama rolled out, so this is the identical weights, not an analogue).
    # Revert: type: ollama, model: deepseek-v4-pro:cloud, drop api_key/base_url.
    type: openai
    config:
      model: deepseek-ai/DeepSeek-V4-Pro-0813
      api_key: ${DEEPINFRA_API_KEY}
      base_url: https://api.deepinfra.com/v1/openai
      timeout: 1200
      temperature: 0.7
      max_tokens: 32768
      context_window_size: 200000   # raised from 131072 to fit the +45% deep-research evidence budget (model max is ~1M; cloud cost negligible)
      stream: true
      think: false  # Disable thinking/reasoning output (saves tokens, faster responses)
  tool_calling:
    type: openai
    config:
      # LOCAL DEEPINFRA TRIAL — glm-5.2:cloud -> zai-org/GLM-5.2, SAME model.
      # Revert: model: glm-5.2:cloud, api_key: "ollama", base_url: http://127.0.0.1:11434/v1
      model: zai-org/GLM-5.2
      timeout: 120
      # INERT on an OpenAI-compatible transport — no client-side context knob exists;
      # the vendor's model context governs. param_map reports this once at first use
      # rather than dropping it silently. Kept as documentation of intent.
      context_window_size: 32768
      temperature: 0.1
      # Output cap for tool selection. Was overridden by a hardcoded max_tokens=4096 at
      # two call sites (fastapi_server_complete.py), so this value was inert and the real
      # cap was invisible from config. Both literals removed 2026-08-15.
      #
      # Derivation, not a guess: with reasoning suppressed (think:false below) GLM-5.2
      # emits only the tool_calls JSON — measured at 28-40 completion tokens for one
      # call. 8192 leaves ~200x headroom for a large multi-tool batch AND absorbs a
      # reasoning tail if a future model ignores the switch. The error is asymmetric:
      # too low = the lane returns ZERO tool calls and the answer is built with no data
      # (observed 2026-08-15); too high = FREE, since billing is on completion_tokens.
      max_tokens: 8192
      # GLM-5.2 on DeepInfra emits reasoning_content that is billed against max_tokens.
      # On Ollama this lane always ran with think defaulting to False; the provider swap
      # silently turned reasoning ON because only ollama.py read this key. param_map now
      # maps it to chat_template_kwargs.enable_thinking on this transport.
      think: false
      stream: false
      api_key: ${DEEPINFRA_API_KEY}
      base_url: https://api.deepinfra.com/v1/openai
  providers:
    ollama:
      base_url: http://127.0.0.1:11434
      health_check_url: http://127.0.0.1:11434/api/tags
      retry_attempts: 3
      retry_delay: 2
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      organization: null
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gpt-4o-mini
        tool_calling: gpt-4o-mini
    openrouter:
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      retry_attempts: 3
      retry_delay: 1
      headers:
        HTTP-Referer: ${OPENROUTER_SITE_URL}
        X-Title: ${OPENROUTER_SITE_NAME}
      models:
        # Liveness re-verified 2026-08-09 by INVOKING each slug (1-token generation).
        # `deepseek/deepseek-r1:free` was retired — OpenRouter answers HTTP 404 naming
        # `deepseek/deepseek-r1` as its replacement. The paid slugs below are LIVE but
        # return 402 on this account ("never purchased credits"); the :free slug is the
        # only one usable today, and it is verified for BOTH completion and tool calling.
        primary: deepseek/deepseek-r1        # was deepseek-r1:free — retired 404 (2026-08)
        tool_calling: openai/gpt-4o-mini     # LIVE, needs credits (402)
        reasoning: deepseek/deepseek-r1      # LIVE, needs credits (402)
        free: openai/gpt-oss-20b:free        # was deepseek-r1:free — retired 404; this
                                             # slug verified 200 + emits valid tool_calls
    # -------------------------------------------------------------------------
    # DeepInfra — OpenAI-compatible cloud inference (added v1.0.0.236, 2026-08-09)
    #
    # DORMANT: no lane points here yet. Declaring a provider block does NOT activate
    # it — a lane only uses this provider when its `type:` says `deepinfra`, at which
    # point config_loader.get_llm_config() merges these keys into that lane's config
    # (utils/config_loader.py:113-119) and the factory maps the type onto
    # OpenAIProvider (llm_providers/factory.py). No new provider module is needed:
    # DeepInfra speaks the same /chat/completions path and `Authorization: Bearer`
    # scheme, exactly as openrouter above does.
    #
    # STATUS 2026-08-09: key authenticates (GET /models = 200, 182 models) and every
    # model slug below was probed valid, but inference returns HTTP 402 "You need
    # positive balance to do inference" — DeepInfra has NO free tier. Nothing here is
    # behaviourally verified yet (tool calling, streaming, think/effort flags all
    # UNTESTED); a 402 proves only that the slug and credentials are real.
    # -------------------------------------------------------------------------
    deepinfra:
      api_key: ${DEEPINFRA_API_KEY}
      base_url: https://api.deepinfra.com/v1/openai
      retry_attempts: 3
      retry_delay: 1
      models:
        # All probed 2026-08-09: HTTP 402 = slug valid, blocked only on balance.
        # (404 would mean the slug does not exist — none of these returned 404.)
        primary: deepseek-ai/DeepSeek-V3.1        # closest analogue to the Ollama primary
        tool_calling: zai-org/GLM-5.2             # same family as the current tool lane
        reasoning: deepseek-ai/DeepSeek-R1-0528
        vision: Qwen/Qwen3-VL-235B-A22B-Instruct
        cheap: meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo  # for smoke tests
    gemini:
      api_key: ${GEMINI_API_KEY}
      model: gemini-flash-latest
      timeout: 120
      temperature: 0.7
      max_tokens: 8192
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gemini-flash-latest
        pro: gemini-pro-latest
        flash: gemini-flash-latest
        stable_flash: gemini-2.5-flash
        stable_pro: gemini-2.5-pro
performance:
  connection_pool_size: 10
  max_concurrent_requests: 5
  request_timeout: 1200
  streaming_chunk_size: 1024
# SI-036 — SECOND TOOL-SELECTION ROUND (non-DR path).
# The non-DR path selects every tool in ONE call, BEFORE any tool has run, so a tool whose
# arguments depend on another tool's OUTPUT can never be chosen. That is why `compute` was never
# called on the Treasury request: you cannot know what to calculate until the CSV is fetched.
# When enabled, after phase-1 tools return, the tool-calling model is shown their output and may
# request FURTHER tools. Off by default — it costs one extra tool-model call per request that
# gathered data.
# SI-037 — lookup_website content limits. These were hardcoded in the tool, which is both a
# configuration-directive violation and how a 20,198-char CSV came to be cut to 10,000 chars by a
# limit written for prose articles.
lookup_website:
  # ARTICLES only. HTML prose is truncated to this many characters, cut at a sentence boundary.
  max_article_chars: 10000
  # DATA files (CSV/TSV/JSON/XML) are bounded by BYTES instead, passed through verbatim, and their
  # truncation is disclosed in-band. A whole year of daily Treasury rates is ~20 KB, so this must
  # be generous enough that ordinary public data files arrive COMPLETE — a partial table produces
  # extrema and totals that are wrong with no way to tell.
  max_data_bytes: 2000000

tool_calling:
  # SI-036 / docs/RAICA_NONDR_GATHER_GATE.md — GATHER GATE.
  # The non-DR path stops gathering on a COUNT, not a CONDITION, so a request whose data arrives
  # after the counter is spent is answered without it: production quoted 4.24% from a web article
  # for a figure the fetched CSV gives as 4.2932%. Deep Research has had the right shape since it
  # was written (_assess -> sufficient/needs_more, research/engine.py:709); this is that shape for
  # the path that never had it.
  # PHASE 0 = SHADOW: the verdict is logged and acted on by nothing. Enable to MEASURE how often
  # `needs_more` is the right answer before letting it change behaviour.
  gather_gate:
    enabled: false
    shadow: true
    # Output cap for the gate's own verdict call. 600 was HARDCODED and proved too small:
    # GLM-5.2 served by DeepInfra spends its first few hundred tokens on preamble, so on a
    # 12,697-char prompt it hit the cap BEFORE emitting any JSON — the verdict came back empty,
    # parsed as nothing, and the loop stopped with reason=unavailable one round before it would
    # have demanded the chart. The same model on Ollama fits inside 600; the TRANSPORT changed
    # the behaviour, which is exactly what a provider swap is not supposed to do.
    assess_max_tokens: 2000
    max_gather_rounds: 3        # hard ceiling once enforcement lands
    wall_clock_seconds: 90      # mirrors deep_research's wall_clock
    model: null                 # null = the tool-calling model (already loaded)
  second_round:
    enabled: true
    # Hard cap on EXTRA selection rounds. 1 means exactly one additional round: tools it requests
    # run, but cannot trigger another round. This is the damper — a round that can request more
    # tools is a control loop, and an undamped one oscillates forever.
    max_extra_rounds: 1
    # How much round-1 output the SELECTOR sees. It must be enough to judge what to do next and,
    # for a tool like `compute`, to re-emit the values as arguments. Truncation is DISCLOSED to
    # the model rather than applied silently.
    # SI-037: sized from MEASURED data, not guessed. One year of daily Treasury rates is ~20 KB and
    # two years ~34 KB, so a 20,000 budget would have re-truncated the very file the truncation fix
    # just repaired — reintroducing the same silent-wrong-extremum bug one layer further in.
    max_chars_per_tool: 100000
    max_chars_total: 200000
    # MEASURED, not guessed. At 4096 the selector consumed its entire completion budget and
    # returned nothing at all — truncated=True, tool_calls=[], content='' — so `compute` and
    # `plot_data` were never called and four separate fixes appeared to fail for the wrong reason.
    # The tokens go on the model's own reasoning before it reaches the call. At 16384 the same
    # request returned 5 tool calls with truncated=False.
    selector_max_tokens: 16384
platform:
  config_dir:
    linux: ${HOME}/.config/agentic_rag
    macos: ${HOME}/.config/agentic_rag
    windows: ${APPDATA}/agentic_rag
  log_dir:
    linux: ${HOME}/.local/share/agentic_rag/logs
    macos: ${HOME}/.local/share/agentic_rag/logs
    windows: ${LOCALAPPDATA}/agentic_rag/logs
  temp_dir:
    linux: /tmp/agentic_rag
    macos: ${TMPDIR}/agentic_rag
    windows: ${TEMP}/agentic_rag
security:
  api_key_encryption: false
  audit_logging: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_limit: 10
arbitrator:
  enabled: true
  type: openai
  config:
    # LOCAL DEEPINFRA TRIAL — same model. Revert: glm-5.2:cloud + api_key "ollama".
    model: zai-org/GLM-5.2
    timeout: 60
    context_window_size: 4096   # NOTE: inert for type:openai — only ollama.py reads
                                # this (as num_ctx). Kept for documentation, and in
                                # case this lane ever moves to an ollama-type provider.
    temperature: 0.1
    # DERIVED, not chosen (v1.0.0.238). Was 1024 — and was ALSO dead config, because
    # manager.py hardcoded 1024 over it until this release.
    #
    # The arbitrator must emit a COMPLETE tasks[] JSON, one entry per executed tool.
    # A truncated reply is unparseable, so the lane fails wholesale rather than
    # degrading. Measured requirement: 477 + 131n (gpt-oss-120b), 577 + 160n (GLM-5.2).
    #
    #   batch 6 (observed production peak, logs/archive): 1097 / 1419 tokens
    #     -> BOTH exceeded the old 1024 cap; GLM truncated on 2/2 runs at batch 6
    #   4096 covers batch 28 (gpt-oss) / batch 22 (GLM) = 3.7x the observed peak
    #
    # Headroom matters because batch size is UNBOUNDED in code
    # (fastapi_server_complete.py:5293 zips over all tools_called). The error is
    # asymmetric: too low = total lane failure; too high = FREE, since billing is on
    # actual completion_tokens, not on the cap.
    #
    # Does NOT cover a reasoning_effort=xhigh tail (one measured run consumed >8000).
    # No fixed cap does — that is what truncation detection is for (v1.0.0.237).
    # reasoning_effort is unreachable in RAICA today: no provider forwards it.
    max_tokens: 4096
    stream: false
    api_key: "ollama"
    base_url: http://127.0.0.1:11434/v1
optimization:
  enabled: true
  rollout_percentage: 100.0
  detailed_logging: true
# ============================================================
# NON-DEEP-RESEARCH OUTPUT-SIDE CITATION GROUNDING (bots + @Ask)
# The non-DR answer path (fastapi_server_complete.llama_stream) has no
# output-side citation grounding like DR does. This audits the finished
# answer for fabricated / reused / bare-homepage citations.
# Phase 0 = SHADOW (log-only, offline, never modifies the answer).
# See docs/RAICA_NONDR_CITATION_GROUNDING.md
# ============================================================
non_dr:
  citation_grounding:
    enabled: true      # master switch for the shadow audit
    shadow: true       # Phase 0 — log-only; enforcement (stripping) not wired yet
  search_article_guard:
    enabled: true      # search_web cites only SPECIFIC-article URLs; reject section/landing pages
                       # (symmetric with get_news_summaries). Reversible: set false to disable.

# ============================================================
# DEEP RESEARCH ENGINE (Stage 0 foundations)
# Source of truth for research depth and the LLM-driven research
# classifier. No depth limits are hardcoded in code anymore.
# ============================================================
deep_research:
  enabled: true
  search:
    web_max_results: 8          # web results per search (legacy hardcoded value was 3)
    per_page_char_budget: 6000  # max chars extracted per page (legacy value was 2000)
    per_page_max_blocks: 12     # max text blocks/paragraphs per page (legacy value was 5)
  citation_verify:
    # Layer 3 of citation accuracy: a LENIENT live check that drops a candidate citation URL ONLY when
    # it is verified dead (hard HTTP 404/410, or a redirect that lands on the site homepage) before it
    # can become a citation. Everything else (200/403/paywall/JS shell/429/5xx/timeout) is KEPT, so a
    # valid article that merely bot-blocks us is never dropped. search_web piggybacks on its existing
    # content fetch (no extra request); news verifies article URLs in parallel. Set enabled:false to turn
    # the whole layer off (e.g. if it adds unacceptable latency to news).
    enabled: true
    timeout_seconds: 6          # per-URL liveness timeout (lenient: a timeout KEEPS the URL)
    max_workers: 8              # parallelism when verifying a batch of news article URLs
  research_classifier:
    # LLM-driven replacement for the old keyword-based _is_research_query().
    # When enabled, an LLM decides (semantically) whether a request is
    # research-oriented so the optimizer preserves more source context.
    # If disabled or unreachable, the system fails SAFE to research=True
    # (maximum context preservation) — it never silently drops accuracy.
    enabled: true
  # ---- Data-charting: chart REAL datasets a query asks for (see docs/DESIGN_data_charts.md) ----
  # Master flag. When false (default) the pipeline is UNCHANGED — search_datasets is NOT offered to the
  # planner (not added to engine.sources.allowed) and the tool self-disables even if called. Isolated on
  # branch feature/data-charts; flip to true only after live end-to-end validation.
  # .env override (precedence): RAICA_DATA_CHARTS_ENABLED=true — per-environment toggle without editing this
  # file (survives git pull), mirroring RAICA_CHARTS_ENABLED. Use it to enable on prod for testing.
  data_charts:
    enabled: false
    sources:
      # Curated authoritative adapters the planner may route search_datasets to. KEY-AGNOSTIC: keyless
      # open sources (world_bank, owid, …) are first-class alongside key-required ones (fbi_cde, fred).
      allowed:
        - world_bank      # keyless — usable with no API key
        - fbi_cde         # needs DATA_GOV_API_KEY / FBI_CDE_API_KEY
        - fred            # needs FRED_API_KEY — U.S. macro-economic series
      catalog:   # data-source definitions (moved from datasources/sources.yaml per single-config rule)

        fred:
          tier: structured_api
          source_name: "FRED — Federal Reserve Bank of St. Louis"
          home_url: "https://fred.stlouisfed.org/"
          title_template: "U.S. {label}, {x_min}–{x_max}"
          # series_id is a QUERY param here (not a path segment), unlike the other sources.
          endpoint: "https://api.stlouisfed.org/fred/series/observations"
          auth: { type: query_key, param: api_key, env: [FRED_API_KEY, FRED_API_KEY_RAICABAKER] }
          params:
            series_id: "{measure_path}"
            file_type: "json"
            observation_start: "{from_year}-01-01"
            observation_end: "{to_year}-12-31"
          shape: fred_observations     # mixed frequencies (M/Q/W/A) → aggregated to annual MEAN
          geo_label: "United States"
          min_year: 1947               # floor so the date params always resolve; FRED returns from series start
          coverage: "varies by series (mostly 1947–present); aggregated to annual"
          value_kinds: [value]
          x: { field: [year], type: temporal, name: year }
          value: { field: [value] }    # unit comes from the measure below
          methodology: "FRED series, aggregated to annual means from the published frequency."
          # DYNAMIC DISCOVERY: anything not in `measures` below is resolved by searching FRED itself, so the
          # catalog need not hand-list every series (FRED has 800k+). See datasources/discovery.py.
          discovery:
            type: fred_search
            search_endpoint: "https://api.stlouisfed.org/fred/series/search"
            limit: 12
          note: >-
            DISCOVERY ENABLED: the measures below are common shortcuts, but you may also set `measure` to a
            plain DESCRIPTION of ANY U.S. economic / financial / housing / labor / demographic series (e.g.
            "Case-Shiller home price index", "homeownership rate", "30-year mortgage rate", "real median house
            price") or a FRED series id — the tool searches FRED and resolves the single best real series,
            reporting which id + coverage it used. For a LONG history, describe the underlying quantity (e.g.
            "home price index", available since 1987) rather than a derived index that may only be recent.
          measures:
            unemployment:              { label: "unemployment rate",              path: "UNRATE",         unit: "% of labor force" }
            labor-force-participation: { label: "labor force participation rate", path: "CIVPART",        unit: "%" }
            inflation-cpi:             { label: "consumer price index (CPI)",     path: "CPIAUCSL",       unit: "index 1982-84=100" }
            gdp:                       { label: "GDP",                            path: "GDP",            unit: "billions of US$" }
            debt-to-gdp:               { label: "federal debt as % of GDP",       path: "GFDEGDQ188S",    unit: "% of GDP" }   # Federal Debt: Total Public Debt as Percent of GDP (the RATIO, not GDP or debt alone)
            gdp-per-capita:            { label: "real GDP per capita",            path: "A939RX0Q048SBEA", unit: "chained 2017 US$" }  # living-standards measure — distinguishes "poorer" (per-capita) from "smaller" (total GDP)
            dollar-index:              { label: "trade-weighted US dollar index", path: "DTWEXBGS",       unit: "index Jan 2006=100" }  # value of the US dollar (broad, 2006+)
            net-exports:               { label: "net exports (trade balance)",    path: "NETEXP",         unit: "billions of US$" }  # exports − imports; the trade balance (1947+)
            nonfarm-payrolls:          { label: "total nonfarm employment",       path: "PAYEMS",         unit: "thousands of persons" }  # total US jobs (1939+)
            fed-funds-rate:            { label: "federal funds rate",             path: "FEDFUNDS",       unit: "%" }
            mortgage-30yr:             { label: "30-year fixed mortgage rate",    path: "MORTGAGE30US",   unit: "%" }
            median-household-income:   { label: "real median household income",   path: "MEHOINUSA672N",  unit: "constant US$" }
            income-inequality-gini:    { label: "income Gini ratio (families)",   path: "GINIALLRF",      unit: "Gini ratio" }

        fbi_cde:
          tier: structured_api
          source_name: "FBI UCR / Crime Data Explorer"
          home_url: "https://cde.ucr.cjis.gov/"
          title_template: "U.S. {label} {value_kind}, {x_min}–{x_max}"
          # LIVE endpoint discovered 2026-07-21 (the documented `estimate/national` path + all public docs/
          # Swagger are dead/404 — see SUSPECTED_ISSUES SI-004). `summarized/national/{offense}` returns
          # MONTHLY national offense rates + actual counts; the fbi_cde_summarized shape aggregates → annual.
          endpoint: "https://api.usa.gov/crime/fbi/cde/summarized/national/{measure_path}"
          auth: { type: query_key, param: API_KEY, env: [FBI_CDE_API_KEY, DATA_GOV_API_KEY] }
          params: { type: "counts", from: "01-{from_year}", to: "12-{to_year}" }   # dates are MM-YYYY
          shape: fbi_cde_summarized
          geo_label: "US-national"
          min_year: 1985           # API 400s on an earlier start; clamp from_year here (and default a missing to_year to current year)
          # FBI's big multi-decade fetch is SLOW-BUT-COMPLETES (~20s when the API is busy), so the global 10s
          # timeout wrongly abandons it → crime silently drops from a combined chart. Give it room + more tries.
          fetch_timeout_seconds: 28
          fetch_retries: 5
          fetch_retry_backoff_seconds: 1.0
          coverage: "~1985–present (monthly, aggregated to annual)"
          value_kinds: [rate, count]
          x: { field: [year, data_year], type: temporal, name: year }
          value:
            field: [rate, rate_per_100000]          # annual rate/100k (sum of 12 monthly rates)
            count_field: [count, actual, value, estimate]   # annual count (sum of 12 monthly actuals)
            unit_rate: "per 100,000"
            unit_count: "offenses"
          methodology: "FBI UCR Crime Data Explorer, national summarized offenses; monthly values summed to annual (complete years only). NOTE: the FBI retired the Summary Reporting System (SRS) and moved to NIBRS-only on 2021-01-01; 2021 agency participation fell to ~63% (vs ~95%+ under SRS), so 2021 and the SRS↔NIBRS boundary are less comparable to prior years (FBI resumed accepting both systems in 2022)."
          # SRS→NIBRS methodology break: the renderer SEGMENTS the line at 2021 and marks it; the digest tells the
          # model to annotate rather than silently bridge. requires_span → only shown when the series crosses 2021.
          discontinuities:
            - { at: 2021, requires_span: true, note: "SRS→NIBRS transition — 2021 coverage ~63% (vs ~95%+), less comparable to prior years" }
          measures:
            violent-crime:        { label: "violent crime",        path: "violent-crime" }
            homicide:             { label: "homicide",             path: "homicide" }
            rape:                 { label: "rape",                 path: "rape" }
            robbery:              { label: "robbery",              path: "robbery" }
            aggravated-assault:   { label: "aggravated assault",   path: "aggravated-assault" }
            property-crime:       { label: "property crime",       path: "property-crime" }
            burglary:             { label: "burglary",             path: "burglary" }
            larceny:              { label: "larceny-theft",        path: "larceny" }
            motor-vehicle-theft:  { label: "motor vehicle theft",  path: "motor-vehicle-theft" }
            arson:                { label: "arson",                path: "arson" }

        world_bank:
          tier: structured_api
          source_name: "World Bank Open Data"
          home_url: "https://data.worldbank.org/"
          title_template: "{label} ({geo}), {x_min}–{x_max}"
          # keyless open API. {geo_path} = country code (default USA); {measure_path} = indicator code.
          endpoint: "https://api.worldbank.org/v2/country/{geo_path}/indicator/{measure_path}?format=json&per_page=20000"
          auth: { type: none }
          params: { date: "{from_year}:{to_year}" }   # WB accepts a date RANGE; dropped if both years absent
          shape: worldbank
          geo_default: "USA"
          geo_resolver: iso3      # adapter maps a country NAME or code → ISO-3166 alpha-3 (so 'Egypt' and 'EGY' both work)
          geo_hint: "country name OR ISO-3166 code (e.g. Egypt/EGY, United States/USA, China/CHN; WLD=world; default USA)"
          # DYNAMIC DISCOVERY: reliable via CODE (WB has no popularity/search signal, so a description is only
          # best-effort matched over the WDI list, fail-closed when weak). See datasources/discovery.py::wb_search.
          discovery:
            type: wb_search
            base: "https://api.worldbank.org/v2"
            min_score: 1.5
          note: >-
            DISCOVERY ENABLED: the measures below are shortcuts, but you may reach ANY World Bank indicator.
            PREFER giving the exact WB indicator CODE — you know these (e.g. FP.CPI.TOTL.ZG = CPI inflation,
            SL.UEM.TOTL.ZS = unemployment, EG.ELC.ACCS.ZS = electricity access, SP.DYN.LE00.IN = life
            expectancy, IT.NET.USER.ZS = internet users) — a code is resolved EXACTLY. You may instead pass a
            plain description, but WB has no search ranking so that is BEST-EFFORT (the tool reports which
            indicator it picked; verify it matches the intent) and fails closed if uncertain. Use the code
            whenever you know it.
          coverage: "1960–present (varies by indicator)"
          value_kinds: [value]
          x: { field: [date], type: temporal, name: year }
          value: { field: [value] }                    # unit comes from the measure below
          measures:
            population:        { label: "population",                 path: "SP.POP.TOTL",     unit: "people" }
            gdp:               { label: "GDP (current US$)",          path: "NY.GDP.MKTP.CD",  unit: "current US$" }
            gdp-per-capita:    { label: "GDP per capita (current US$)", path: "NY.GDP.PCAP.CD", unit: "current US$" }
            co2-per-capita:    { label: "CO₂ emissions per capita",   path: "EN.GHG.CO2.PC.CE.AR5",  unit: "t CO₂e per capita" }  # WB archived the old EN.ATM.CO2E.PC; AR5/EDGAR series (excl. LULUCF), source=2/WDI
            co2-total:         { label: "CO₂ emissions (total)",      path: "EN.GHG.CO2.MT.CE.AR5",  unit: "Mt CO₂e" }              # total national CO₂; AR5/EDGAR (excl. LULUCF), source=2/WDI. WB archived the old EN.ATM.CO2E.KT
            life-expectancy:   { label: "life expectancy at birth",   path: "SP.DYN.LE00.IN",  unit: "years" }
            unemployment:      { label: "unemployment rate",          path: "SL.UEM.TOTL.ZS",  unit: "% of labor force" }
            inflation:         { label: "inflation (CPI)",            path: "FP.CPI.TOTL.ZG",  unit: "% annual" }
    max_per_response: 4           # cap on data charts per answer (fail-closed budget)
    fetch_timeout_seconds: 10     # SHORT per-attempt timeout: World Bank/Cloudflare latency is bimodal (~0.2s
                                  # normally, but transient 30-40s CDN bursts) — abandon a slow connection fast
                                  # and re-roll on a fresh one, rather than stalling the whole gather round.
    fetch_retries: 4              # several fail-fast attempts, each on a NEW connection (Connection: close), so
                                  # a retry can land on a healthy edge; a slow burst shouldn't kill the chart.
    fetch_retry_backoff_seconds: 0.5   # brief pause between attempts
    render:
      width_px: 760
      height_px: 430
  # ---- Stage 1: Deep Research Engine ----
  engine:
    enabled: true
    # Citation grounding (output-side safety net): classify every cited URL against the GATHERED evidence;
    # strip FABRICATED links (URLs no tool returned — the model invented them, e.g. a 404 news article with a
    # fabricated opaque ID) while distinguishing provider-ROTTED links (gathered but now dead — hot stories
    # get pulled/moved). Start in SHADOW (log only, answer unchanged) to baseline the live fabrication rate;
    # set shadow:false to ENFORCE. No-op on healthy paths (wiki/papers/static — every cited URL is in
    # evidence). on_unsourced governs a block left with 0 valid sources after grounding.
    citation_grounding:
      enabled: true
      shadow: true              # NOTE: EFFECTIVELY ENFORCED regardless of this flag — pipeline.py computes
                                # `_effective_shadow = shadow AND not verify_live.enforcing`; verify_live is
                                # enforcing (below), so grounding runs ACTIVE (strips fabricated + rotted).
                                # This flag only bites if verify_live is ALSO shadowed. (Kept true so disabling
                                # verify_live cleanly reverts BOTH to shadow.)
      on_unsourced: flag        # flag (mark) | drop (remove block) | off
      # Output-side citation LIVENESS (docs/RAICA_DR_CITATION_LIVENESS.md). Actually FETCHES each CITED URL
      # and treats only a hard 404/410 or an article→homepage redirect as dead (403/paywall/JS/timeout are
      # KEPT — a bot-blocked valid article is never dropped). The verified-dead set feeds grounding as
      # `dead_urls` so a dead "Page not found" link is stripped as ROTTED (headline text kept). Phase 0 =
      # SHADOW: fetch + log the would-be dead-strips, answer UNCHANGED, to baseline the live dead-link rate
      # before enforcing. Set shadow:false to ENFORCE (strip). enabled:false turns the whole liveness step off.
      verify_live:
        enabled: true
        shadow: false           # PHASE 1 (v1.0.0.136): ENFORCE — strip verified-dead cited links (headline
                                #   text kept). true = shadow (fetch + log only, answer unchanged).
        timeout_seconds: 6      # lenient per-URL liveness timeout (a timeout KEEPS the URL)
        max_workers: 8          # parallelism for the cited-URL liveness batch
        # A dead verdict is re-verified once (short pause + re-fetch) before a link is stripped, so a
        # transient CDN/rate-limit flap never removes a valid citation (research/link_liveness.py).
    # RETRIEVAL-QUALITY AUDIT (docs/RAICA_DR_CITATION_LIVENESS.md §groundedness). SHADOW measurement only —
    # never changes the answer. For each CITED url, classifies what RAICA actually held: real body / thin
    # (snippet-only) / error (403/paywall/5xx extraction-error) / over_captured (cited but never fetched as a
    # source) / absent. Logs "📊 retrieval-audit: ..." to quantify body-retrieval (hallucination) exposure
    # before designing a fix. Pure/offline, fail-open. enabled:false turns it off.
    retrieval_audit:
      enabled: true
      min_body_chars: 200       # fetched body shorter than this counts as 'thin' (snippet-only / sparse)
    # LOAD-BASED MODEL SPLIT for deep-research LLM calls. Deep research is NOT one-size-fits-all:
    # the high-frequency, SMALL calls (gate, planner, roster, grade, verify — all <~140K chars) run
    # great on the fast/cheap LIGHT model, while the single LARGE call (synthesis, which assembles
    # the whole evidence pile — observed ~596K chars) overwhelms the light cloud endpoint and gets
    # an intermittent HTTP 500. So we route by PAYLOAD SIZE (len(prompt)), not by node name:
    #   * prompt_len  <  heavy_threshold_chars  -> `model`       (light: fast, cheap)
    #   * prompt_len >= heavy_threshold_chars  -> `heavy_model` (heavy: tolerates big prompts)
    # This keeps pro's cost/latency ONLY on the rare heavy call; everything else stays on flash. A
    # SMALL synthesis (little evidence) still rides the light model — it's load-driven, not per-node.
    # The NORMAL chat path (e.g. Ask answering a hard reasoning puzzle) still uses the global
    # `primary` (pro) directly. null `model` = use primary; null `heavy_model` = no heavy routing.
    # --- OUTPUT budgets for the JSON-returning control calls (SI-015, v1.0.0.240) ------
    # Each caps an LLM call whose reply is parsed with extract_json_object(). Truncated
    # JSON is swallowed by an except branch and DR degrades into a fallback that LOOKS
    # successful — so a cap set too low causes SILENT quality loss, never an error.
    #
    # SIZING BASIS — deliberately NOT fitted to a measurement. A reconstruction of the
    # production payload produced only ~536 tokens and did NOT reproduce the truncation,
    # so the true requirement is UNKNOWN. What IS known is the FAILURE point: 900
    # truncated in production at 17-24 evidence items / 92-114 URLs, twice in one run.
    # The error is asymmetric — too low degrades silently, too high is FREE (billing is on
    # actual completion_tokens, not the cap) — so these sit well above the observed failure
    # point. v1.0.0.237 truncation detection is the backstop: if `TRUNCATED` appears on
    # these lanes again, raise them.
    decompose_max_tokens: 4000   # was hardcoded 2000 (research/pipeline.py) — carries
                                 # `actions`, the email/PDF delivery directives. Truncation
                                 # here silently drops the user's deliverable.
    verification:
      max_tokens: 32000          # code default was 12000 and this key was ABSENT, so the
                                 # default applied — and it TRUNCATED on the largest run.
                                 # Claim extraction under-samples a long answer when cut,
                                 # so late claims go unverified while grounding still
                                 # reports coverage. The code comment already warned this
                                 # "must be generous"; 12000 was not.
      # SI-025: these four lived under `synthesis:` at the WRONG indentation, so YAML made
      # them synthesis siblings and `evidence_token_budget: 87000` silently overrode
      # synthesis's 160000 (last key wins). The code reads them HERE, at engine level, so
      # none of them were ever applied. `max_tokens` is NOT re-added: the 32000 above
      # supersedes the stranded 24000.
      enabled: true
      # A claim needs at least this many independent sources to be labeled "supported".
      min_corroborating_sources: 2
      # Evidence document sent to the VERIFIER — deliberately below the synthesis budget
      # so the verify INPUT does not fill the window and starve the output JSON.
      evidence_token_budget: 87000
      # Model that EXTRACTS + VERIFIES claims. null = primary (gemma4:31b rubber-stamped).
      verify_model: null
    model: deepseek-v4-flash:cloud           # LIGHT — default for all small DR calls
    heavy_model: deepseek-v4-pro:cloud       # HEAVY — large-payload calls (e.g. synthesis)
    heavy_threshold_chars: 20000             # prompt chars at/above which -> heavy_model (pro). 20000 =
                                             # highest-quality DR baseline: every real synthesis (~30K+) and
                                             # verify (100K+) routes to deepseek-v4-pro (more professional,
                                             # persuasive output — 2026-07-11 flash-vs-pro study); only the
                                             # small mechanical sub-calls (plan/grade/relevance, <~8K) stay on
                                             # flash. Dev==prod (identical). Cost-reduction tuning deferred.
                                             # (synthesis ~596K >> 250K; next-biggest call ~139K < 250K)
    # Phase 0 (orchestration retrofit): before researching, LLM-extract the RESEARCH-and-writing
    # intent from a possibly-compound request, stripping delivery/packaging directives (generate
    # PDF/HTML, save file, email, post to social/publishing) and recipient addresses. The research
    # + synthesis stages must produce the CONTENT only; delivery is handled downstream by POST-LLM
    # execution / the orchestrator. This prevents the synthesizer from refusing a whole task because
    # it "cannot send email / create PDFs". false = pass the raw request through (legacy behavior).
    normalize_request: true
    # Phase 2 delivery fan-out (gated by the trusted-client allow_delivery flag). After research,
    # decomposed actions (render PDF, email, …) are executed by directly dispatching existing tools.
    delivery:
      # Local deliverables in sandbox_workspace are KEPT after sending (and always kept on failure),
      # then a best-effort TTL sweep purges files older than this many hours so disk stays bounded.
      retention_hours: 72
      # Phase 3 — DYNAMIC ACTION DISPATCH (open-vocabulary tool integration, Principle 6).
      # The decomposer already emits an OPEN action vocabulary grounded in the live tool catalog
      # (any registered tool, not a fixed enum). With this ON, RAICA dispatches EVERY such action
      # generically: for each action whose `type` resolves to a real tool, an LLM "arg-binder" call
      # is shown that tool's FULL parameter schema + the research output + the user's intent + the
      # results of prior actions (sequential, dependency-aware), and returns the exact arguments;
      # RAICA then runs the tool via safe_function_call. New tools need ZERO code here (Generalization
      # Test). The proven file+email secure pipeline (recipient-locking, doc-fail-blocks-email) is
      # UNCHANGED and runs after the generic pass. false = legacy: only file+email are wired, other
      # actions are reported "not wired yet".
      dynamic_dispatch: true
      # Max output tokens for each arg-binder LLM call (it returns a small JSON arguments object).
      binder_max_tokens: 1500
      # Per-action dispatch hard timeout (seconds) so one slow/hung tool can't stall the whole run.
      action_timeout_seconds: 180
      # How many chars of the research output to show the arg-binder as shared context (it can also
      # use the literal "{{RESEARCH_OUTPUT}}" placeholder for any field that should carry the FULL
      # paper verbatim — RAICA substitutes it before dispatch, so the LLM never retypes the paper).
      context_char_budget: 12000
    retry:
      # Resilience for transient upstream LLM-provider 5xx errors (e.g. Ollama-cloud "500 Internal
      # Server Error"). Deep research is a long, resource-heavy operation; rather than fail a run on a
      # transient blip, RETRY the failed LLM call up to max_attempts, waiting delay_seconds between
      # tries (gives the provider time to recover). Applies ONLY to 5xx; other errors fail fast.
      # If all attempts fail, the user is told the model is temporarily unavailable (try again later).
      # Tuned to fit under client read-timeouts: each silent wait (delay_seconds) must stay below the
      # client's read timeout (NewX @Ask = 900s; OpenWebUI default shorter). 3 attempts × 120s = 2
      # recovery chances, each 120s gap well under those limits.
      max_attempts: 3
      delay_seconds: 120
    output:
      # Clients that want only the clean answer can suppress the framing.
      stream_progress: false        # live "> Planning… > Round k…" lines + the Deep Research header
      include_audit_footer: true   # the "### 🔎 Research Audit" footer (sources/credibility/claims)
    planner:
      # LLM decomposes a research request into sub-questions + per-question source
      # strategy. max_sub_questions caps planner breadth; the LLM proposes fewer when apt.
      max_sub_questions: 6
      # SI-015 (v1.0.0.240): was a hardcoded 1200 in research/engine.py. OUTPUT cap on
      # the plan JSON; truncation makes the plan unparseable and all 3 retries fail alike.
      max_tokens: 4000
      # Per-source query override (v1.0.0.157). When true, the planner MAY emit a `queries` map
      # per sub-question so a source whose argument is NOT a natural-language search string
      # (e.g. comprehensive_stock_analyzer wants {"ticker":"PLTR","detailed":true}; or a LIST of
      # such args for multiple stocks PLTR/MSFT/...) receives the EXACT arg(s) it expects instead
      # of the sub-question text. Inherently backward-safe: absent/no-entry → Round 1 uses the
      # sub-question text exactly as before (zero change for search-style sources / non-stock
      # queries). Set false for a one-line rollback to v1.0.0.155 behavior everywhere.
      per_source_queries: true
      # Cluster B (docs/RAICA_DR_ADVERSARIAL_BALANCE.md, Phase 2). When true, the planner is told to reach
      # PRIMARY peer-reviewed scholarship (published_papers_search → OpenAlex/Crossref/CORE/DOAB/Semantic
      # Scholar/arXiv/PubMed) for scholarly/historical/humanities claims INSTEAD OF tertiary wikis/SEO, to
      # seek the competing models + historiography, and to decompose adversarially (seek the opposing side).
      # Policy language, LLM-judged, no hardcoded topic lists. false = prior (weak "prefer academic") hint.
      gather_quality:
        enabled: true
    loop:
      # Iterative gather loop ceilings (LLM proposes within these; RAICA clamps).
      max_rounds_ceiling: 4
      wall_clock_seconds: 240
      # SI-015 (v1.0.0.240): was a hardcoded 900 in research/engine.py. OUTPUT cap on the
      # gap-assessment JSON (gaps + next_queries). CONFIRMED truncating in production on
      # BOTH DeepSeek-V3.1 and V4-Flash — model-independent. On truncation the except
      # branch returns status=sufficient with EMPTY gaps, so later rounds lose their
      # targeted follow-ups while DR still reports success.
      assess_max_tokens: 4000
    sources:
      # Tool names (must exist in AsyncToolManager.available_functions) the planner may
      # choose from. The LLM picks per sub-question; RAICA only dispatches what's listed.
      allowed:
        - search_web
        - get_news_summaries
        - wikipedia_query
        - published_papers_search
        - get_sec_filings
        - document_search
        # Structured finance/data tools — return real-time fundamentals & valuation directly
        # (yfinance) so quantitative stock/valuation queries don't degrade to search_web scraping.
        # Added v1.0.0.156 (DR was fanning PLTR valuation to blocked web searches instead of these).
        - comprehensive_stock_analyzer
        - get_stock_and_company_data
    # ---- Stage 2: synthesis, verification, arbitration ----
    synthesis:
      # Grounded draft from the evidence pool. Credibility-aware: scholarly claims must
      # lean on higher-tier sources; low-tier sources are reported as "claimed by X".
      credibility_grading: true
      # CONTENT-QUALITY GATE (docs/RAICA_DR_CITATION_LIVENESS.md §groundedness). Marks source blocks whose
      # page BODY could not be fetched (extraction-error/paywall — ~2% of live citations) so the synthesizer
      # knows it holds only the TITLE, not the article, and won't attribute specific facts/quotes/stats to
      # them. Marks 'error' blocks only (a short abstract/snippet is real content). SHADOW = count + log only
      # (evidence + prompt UNCHANGED); shadow:false = ACTIVE (annotate evidence + add the attribution rule).
      # Fail-open; enabled:false turns it off.
      retrieval_gate:
        enabled: true
        shadow: false                    # ENFORCE (v1.0.0.182): annotate body-not-retrieved (title-only)
                                         # blocks with ⚠️ BODY-NOT-RETRIEVED + add the attribution rule so
                                         # synthesis never presents unseen specifics as sourced to them
                                         # (governs ATTRIBUTION, not exclusion). Baseline: ~10-21 title-only
                                         # blocks/run; most cited URLs are body-fetched. true = shadow (log only).
      # ADVERSARIAL BALANCE (docs/RAICA_DR_ADVERSARIAL_BALANCE.md, Phase 1/P3). Adds a synthesis directive that
      # calibrates to EPISTEMIC STATUS: report established empirical science as settled (NO invented balance);
      # label speculative science as conjecture + explain differential support; and on SUBJECTIVE questions
      # (humanities/philosophy/religion) steelman BOTH sides, break the source echo-chamber, and don't backfill
      # thin evidence from parametric memory. Policy language only (LLM judges domain/status/echo-chamber — no
      # hardcoded topic lists). Prompt-only, fail-open; enabled:false reverts to prior behavior.
      adversarial_balance:
        enabled: true
      # SOURCE PROVENANCE (primary-vs-secondary) — docs/RAICA_SOURCE_PROVENANCE.md. Phase 0 wires ONLY
      # the shadow role-grading + logging (a baseline; ZERO answer change — roles are logged, not fed to
      # synthesis). Later phases flip prefer_primary (synthesis prefers the primary in evidence),
      # chase_primary (gather loop seeks the origin for secondary-only claims), and corroboration/footer
      # flags. All fail-open; set enabled:false to fully disable.
      source_provenance:
        enabled: true
        shadow: true                     # Phase 0: compute + log only
        prefer_primary: false            # Phase 1 (delivered as policy by the synthesis PRIMARY-FIRST directive)
        chase_primary: false             # REVERTED v1.0.0.150: it pushed the gather toward paper corpora
                                         # (OpenAlex/Crossref/DOAB = ABSTRACT/metadata only) → thin evidence
                                         # (real=1/thin=9) → synthesis degraded to a "list of sources". Needs a
                                         # full-CONTENT chase (not metadata) before re-enabling.
        corroboration_elevates: false    # Phase 3
        min_independent_secondaries: 2   # the "multiple witnesses" threshold
        flag_single_secondary: false     # Phase 3
      # SOURCE↔TOPIC relevance gate (docs/RAICA_DR_SOURCE_RELEVANCE.md — layer B, lead).
      # LLM flags gathered sources that are only a keyword/homonym match for the topic (e.g. a CS
      # 'Byzantine Agreement' paper for the Byzantine Empire). Phase 0 = shadow (log-only, fail-open).
      source_relevance:
        enabled: true
        shadow: true                     # REVERTED to SHADOW v1.0.0.151: the judge OVER-FLAGS on-topic
                                         # academic sources (e.g. "Modeling Criminal Street Gangs as
                                         # Organizations" for a gangs query) → B-enforce wrongly stripped good
                                         # citations → few citations + ugly "unverified" markers. Needs a more
                                         # accurate judge (better model / per-source w/ abstract) before enforce.
        domain_fit_judge: true           # Layer A: LLM routes published_papers_search to domain-appropriate
                                         # corpora (humanities topics skip arxiv/pubmed/biorxiv). Fail-open.
      # A deep run can gather >1MB of evidence, overflowing the model context window.
      # The evidence fed to each LLM call is budgeted to this many TOKENS (measured with
      # tiktoken), shared fairly across sources (small sources kept whole, leftover given
      # to large ones, which are truncated only if needed). Keep below the model window
      # (context_window_size, 200000 tokens) minus headroom for instructions + the generated answer.
      # Raised 110000 -> 160000 (+45%) to retain more evidence on large research runs.
      evidence_token_budget: 160000
      # SI-025 — sources whose output is COMPUTED and therefore irreplaceable. Web prose is
      # redundant (five articles say much the same), so truncating one loses little; a tool
      # block's DCF, ratio suite and rendered chart exist in exactly ONE place. Under a flat
      # fair-share these were truncated FIRST because they are the largest blocks, and since
      # the analyzer appends its [[chart:...]] marker LAST, head-truncation destroyed exactly
      # the part that cannot be re-derived. Served first now, bounded by the ceiling below so
      # scraped evidence is never starved on a many-entity request.
      priority_sources:
        - comprehensive_stock_analyzer
        - get_stock_and_company_data
      priority_budget_ceiling: 0.70
      # Max tokens for the generated answer. Deep research has rich evidence to draw on;
      # give the model room to elaborate fully (kept well within the model window).
      max_answer_tokens: 32000   # 8000→16000→32000: 16000 hit 100% of cap on a 5-stock full-detail report
                                 # (2026-07-11, "AT CAP — may be truncated"). Model ctx=200000 (max ~1M) + client
                                 # read-timeout 900s both allow it (2× synthesis ≈ +65s → ~260s total run).
      # Two-pass enumeration: for LIST/TABLE/"earliest/all" requests, first extract the COMPLETE
      # item roster from a breadth-first view of ALL evidence (before token-budget truncation can
      # drop boundary items), then synthesize a row for every item. Fixes enumeration-completeness
      # gaps (e.g. a "earliest civilizations" table that dropped the Neolithic cultures because
      # their evidence got truncated). Detection + roster are best-effort: on disable or ANY
      # failure, synthesis falls back to the normal single-pass path (no behavior change for
      # non-enumeration queries).
      enumeration_two_pass: true
      # INLINE-CHART MARKER COMPLETENESS (fix, 2026-07-11). The stock analyzer prepends a
      # `[[chart:...]]` marker (a NewX-rendered technical chart) to each stock's technical block. The
      # synthesis writer (deepseek-v4-flash for sub-heavy-threshold prompts) relays it reliably for ONE
      # stock but on a MULTI-stock report drops the markers STOCHASTICALLY and all-or-nothing (measured
      # 6 identical runs: [0,5,0,0,0,5] — ~2/3 drop rate; never partial). Two rule-compliant mitigations
      # (both keep the LLM as the placement decider — no hardcoded injection):
      #   1) synthesis surfaces the markers as a salient "AVAILABLE CHARTS" checklist OUTSIDE the evidence
      #      SOURCE blocks (buried in a source block the writer treats them as reference to summarize away;
      #      as an explicit checklist it treats them as content to emit) → first-pass relay ~2/6 → 5/5.
      #   2) after the draft, RAICA mechanically verifies every evidence marker is present and, if any were
      #      dropped, feeds them back for the LLM to re-place (bounded passes; the LLM decides where). This
      #      is the same verify→feedback→regenerate loop as verification/enumeration_two_pass.
      # No-op when the evidence has no chart markers (all normal research) or the draft already relayed
      # them all. Fail-safe: a repair that shrinks the report past min_content_ratio, or doesn't improve
      # coverage, is rejected; after max_repair_passes the best draft is returned (a missing chart never
      # destroys a good answer).
      chart_completeness:
        enabled: true
        max_repair_passes: 3       # bounded LLM re-place attempts before returning the best draft
        min_content_ratio: 0.85    # reject a repair that keeps < this fraction of the draft's length
    arbitration:
      # Run synthesis on multiple models and reconcile disagreements. Set enabled:false
      # to skip the extra model cost (single-model synthesis still gets verified).
      #
      # DISABLED (2026-06-01): the reconcile step received the drafts but NOT the evidence
      # pool, so its "enrich/preserve against the evidence" instructions were impossible to
      # follow — it collapsed two rich evidence-grounded drafts (~31-33K chars) to ~21K.
      # Two-model arbitration only pays off when the draft models are PEERS in depth/breadth;
      # deepseek-v4-pro and gpt-oss-120b are not. So we now do single-model synthesis on the
      # primary (full evidence in-context) + verification. Revisit only with on-par models.
      enabled: false
      models:
        - deepseek-v4-pro:cloud
        - gpt-oss:120b-cloud
      # Model that RECONCILES the drafts. null = use the primary model (deepseek-v4-pro).
      # The reconcile step is the heaviest Stage-2 LLM call AND the hardest reasoning
      # (long-context merge + conflict detection), so trading it to a smaller/faster model
      # is a speed-vs-quality experiment — measure both. Set back to null to revert.
      # NOTE (2026-06-01 test): gemma4:31b here cut the final answer ~55% (9.7K vs 21K chars)
      # — it summarized instead of merging, killing the elaboration goal. Keep at null.
      arbitration_model: null   # setting it to null will default to primary model

# ============================================================================
# CONTEXT-AND-ACTION SUBSTRATE CONVERGENCE (docs/RAICA_CONTEXT_SUBSTRATE_CONVERGENCE.md)
# ============================================================================
convergence:
  # Phase 2 — SHADOW-MODE LLM intent classifier. When enabled, an LLM intent classifier runs
  # ALONGSIDE the legacy keyword classifier (_verify_task_completion) on each verified request, and
  # the two results are compared and logged. The legacy result stays AUTHORITATIVE — this is purely
  # observational (zero behavior change), to gather real-traffic divergence data before Phase 3 cuts
  # intent classification over to the LLM. The shadow runs as a NON-BLOCKING background task, so it
  # never adds latency to the user's response.
  shadow_classifier:
    enabled: false              # master switch — turn on to collect divergence data
    sample_rate: 1.0            # fraction of eligible requests to shadow (0.0–1.0) to bound cost
    model: deepseek-v4-flash:cloud   # light/cheap model for the classification call (null = primary)
    max_prompt_chars: 8000      # skip shadowing requests whose prompt exceeds this (cost guard)
    max_tokens: 800             # output cap for the classifier JSON
    timeout_seconds: 60         # hard timeout for the background shadow call
    # Disagreements are appended (best-effort) as JSONL here for offline analysis; every shadow run
    # also emits a "🕵️ SHADOW CLASSIFIER" log line. Empty/null = log only (no file).
    divergence_log: logs/shadow_classifier_divergence.jsonl
  # Phase 3c — AUTHORITATIVE LLM intent classifier (the cutover). When mode=llm, the LLM intent
  # classifier (orchestration/intent.py) replaces the legacy keyword classifier for the
  # post-generation delivery decision AND the tool selection (FULL tool set). The legacy classifier is
  # ALWAYS still computed and is the FALLBACK on LLM error/timeout/over-length. mode=legacy (default)
  # keeps the legacy classifier authoritative — i.e. shipping this changes NOTHING until you flip it.
  # Baseline (v1.0.0.84): LLM delivery-decision 100% stable vs legacy 71.9%; exact-tool stability 93.8%.
  # NOTE: the POST-LLM executor natively dispatches file + email + social_media_* (publish); other LLM
  # tool picks (e.g. image/chart) await Phase 4 generic dispatch.
  intent_classifier:
    mode: llm                        # legacy | llm  [VALIDATION on dev: prompt hardened vs system-directive bias, 2026-06-06]
    model: deepseek-v4-flash:cloud   # classifier model (null = primary)
    max_tokens: 800
    timeout_seconds: 30              # exceeded → legacy fallback
    max_prompt_chars: 12000          # over this → legacy fallback (latency/cost guard)

code_generation:
  # ============================================================
  # MODEL SELECTION - Change this ONE value to switch models
  # ============================================================
  selected_model: deepseek-v4-pro:cloud

  # Classification model override (for tasks requiring strict JSON output)
  # Kimi is great at code generation but returns thinking tags instead of pure JSON
  # Use a model that reliably returns JSON for classification/orchestration tasks
  classification_model: gpt-oss:120b-cloud  # qwen3-next requires reasoning_effort param; qwen3-coder:480b-cloud sometimes 503

  # Available model presets (friendly name → provider + model)
  model_presets:
    # OpenAI models
    gpt-4o:
      provider: openai
      model: gpt-4o
    gpt-4o-mini:
      provider: openai
      model: gpt-4o-mini
    gpt-4-turbo:
      provider: openai
      model: gpt-4-turbo
    # Anthropic Claude models
    claude-sonnet:
      provider: anthropic
      model: claude-sonnet-4-20250514
    claude-opus:
      provider: anthropic
      model: claude-opus-4-20250514
    # Google Gemini models
    gemini-flash:
      provider: gemini
      model: gemini-flash-latest  # was gemini-2.0-flash — Google retired it (HTTP 404
                                  # "no longer available", verified 2026-08-09). The
                                  # -latest alias is LIVE and already used at llm.vision.
    gemini-pro:
      provider: gemini
      model: gemini-2.5-pro       # verified LIVE 2026-08-09 (200)
    # Ollama local models
    Kimi-k2.5:
      provider: ollama
      model: Kimi-k2.5:cloud
    gpt-oss-20b:
      provider: ollama
      model: gpt-oss:20b-cloud
    gpt-oss-120b:
      provider: ollama
      model: gpt-oss:120b-cloud
    glm-4.7:
      provider: ollama
      model: glm-5.2:cloud            # was glm-4.7:cloud — Ollama retired glm-4.7/glm-5 (2026-07) → glm-5.2
    deepseek-v3:
      provider: ollama
      model: deepseek-v4-flash:cloud  # was deepseek-v3.1:671b-cloud — retired (2026-07) → deepseek-v4-flash
    qwen-coder:
      provider: ollama
      model: qwen3.5:397b-cloud       # was qwen3-coder:480b-cloud — retired (2026-07) → qwen3.5:397b
    qwen3-coder-next:
      provider: ollama
      model: qwen3.5:397b-cloud       # was qwen3-coder-next:cloud — retired (2026-07) → qwen3.5:397b
    # (ministral-3:14b catalog entry removed — Ollama retired ministral-3:* with no cloud equivalent, 2026-07)

  # Fallback order (used when selected model fails)
  fallback:
    enabled: true
    order:
      # Best models first - automatic fallback chain
      - provider: ollama
        model: gpt-oss:120b-cloud
      - provider: ollama
        model: qwen3.5:397b-cloud       # was qwen3-coder:480b-cloud — retired (2026-07)
      - provider: openai
        model: gpt-4o
      - provider: anthropic
        model: claude-sonnet-4-20250514
      - provider: openai
        model: gpt-4o-mini
      - provider: gemini
        model: gemini-flash-latest      # was gemini-2.0-flash — retired 404 (2026-08)
      - provider: ollama
        model: deepseek-v4-flash:cloud  # was deepseek-v3.1:671b-cloud — retired (2026-07)
      - provider: ollama
        model: qwen3.5:397b-cloud       # was qwen3-coder:480b-cloud — retired (2026-07)

  # Provider configurations (credentials and settings)
  providers:
    openai:
      model: gpt-4o
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      timeout: 300
      temperature: 0.0
      max_tokens: 16384
      retry_attempts: 3
      retry_delay: 2
    anthropic:
      model: claude-sonnet-4-20250514
      api_key: ${ANTHROPIC_API_KEY}
      base_url: https://api.anthropic.com
      timeout: 300
      temperature: 0.0
      max_tokens: 16384
      retry_attempts: 3
      retry_delay: 2
    gemini:
      model: gemini-flash-latest  # was gemini-2.0-flash — retired 404 (verified 2026-08-09)
      api_key: ${GEMINI_API_KEY}
      timeout: 300
      temperature: 0.0
      max_tokens: 32768
      retry_attempts: 3
      retry_delay: 2
    ollama:
      # Single ollama config - use Kimi-k2 as default
      model: kimi-k2.6:cloud
      base_url: http://127.0.0.1:11434
      timeout: 1200
      temperature: 0.7
      max_tokens: 32768
      context_window: 131072
      retry_attempts: 2
      retry_delay: 2
      think: false  # Disable thinking/reasoning output (saves tokens, faster responses)
vision:
  type: ollama
  config:
    model: minimax-m3:cloud   # 2026-07-31: swapped in from kimi-k2.7-code:cloud after image input failed on both the then-primary and the then-fallback (gemma4:31b-cloud). minimax-m3 verified by sending a test image (red circle, blue square, the word SEVEN) and confirming the reply named all three, including reading the TEXT — i.e. genuine OCR, not a guess from the prompt. ⚠️ CORRECTION 2026-08-05: this comment previously claimed Ollama "does NOT serve" kimi-k2.7-code:cloud and that gemma4:31b-cloud was "unserved". BOTH ARE FALSE — re-probed by INVOKING them and both answer normally (gemma4:31b-cloud is vision-capable too). That claim came from reading /api/tags, which only lists models PULLED LOCALLY and is evidence in NEITHER direction: a never-pulled cloud model is absent yet works, while RETIRED qwen3-vl:235b-cloud stays LISTED and returns HTTP 410. So the recorded cause of the 2026-07-31 vision break is WRONG and the real cause is UNKNOWN (see SI-005) — the swap itself stands only because minimax-m3/kimi-k2.6 were verified with a real image. Establish availability ONLY by invoking (`config_server_cli.py doctor --probe`), never by a listing. Both vision models must be CLOUD: the live server has NO GPU, so a local vision model (e.g. qwen2.5vl:3b) thrashes the CPU.

# =============================================================================
# INLINE CHART CARDS (Option B) — generate per-stock technical charts, upload to NewX, embed
# [[chart:...]] markers in the analysis. Default OFF. See docs (NewX DESIGN_inline_chart_cards.md).
# The shared upload secret is a .env secret (CHART_UPLOAD_SECRET), NOT here.
# =============================================================================
charts:
  enabled: true                  # master switch (also requires newx_upload_url + CHART_UPLOAD_SECRET)
  newx_upload_url: "https://localhost:9876/internal/chart-upload"  # NewX chart-upload endpoint (loopback, same host)
  verify_tls: false             # loopback same-host: NewX cert is self-signed/CN-mismatched; shared secret is the auth
  display_days: 126             # trading sessions shown on the main chart (~6 months)
  # Per-response chart budget (multi-stock fair allocation, 2026-07-19). Every stock is GUARANTEED its
  # minimum FIRST (main chart is requested before sub-charts, so it's always reserved); EXTRA sub-charts
  # then come from the shared soft pool; a hard ceiling guards a huge basket. So an 8-stock basket gives
  # all 8 their main+1 sub, instead of 3 stocks fully-charted and 5 blank.
  min_charts_per_stock: 2       # each stock guaranteed at least this many (its main chart + 1 event sub-chart),
                                # reserved before the shared pool — honored even in a large multi-stock basket
  max_per_response: 10          # SOFT pool: beyond each stock's minimum, extra sub-charts are granted only
                                # while the running total is below this (few-stock queries → richer charts)
  hard_cap_per_response: 30     # ABSOLUTE ceiling on total charts per response (safety net for a huge basket)
  cache_ttl_seconds: 1800       # reuse a (ticker, window) chart for 30 min → popular tickers render once, not per request

  # ── Event-anchored technical sub-charts (Phase 5) — see docs/DESIGN_event_anchored_subcharts.md ──
  # TWEAK THE LONG/SHORT-TERM BOUNDARIES HERE — one place, no code change. Sessions are trading days
  # (~21/mo, ~63/qtr, ~126/6mo, ~252/yr, ~504/2yr). `default` is used when the query horizon is ambiguous.
  trend_categories:
    default: short_term
    long_term:
      display_sessions: 504      # main-chart span (~2 years horizon)
      fetch_sessions: 756        # history to fetch (~3y) so SMA200 is warmed across the whole span
      prior_sessions: 126        # "prior emphasis" lookback (~2 fiscal quarters) for featuring events
      event_zoom_sessions: 25    # sub-chart crops to event ± this many sessions (~5 weeks)
    short_term:
      display_sessions: 126      # main-chart span (~6 months horizon)
      fetch_sessions: 378        # ~1.5y so SMA200 is warmed across the span
      prior_sessions: 63         # ~1 fiscal quarter
      event_zoom_sessions: 12    # event ± ~2.5 weeks

  # ── Deterministic event-detection thresholds (all tunable; NEVER a buy/sell signal — just dated states) ──
  detection:
    rsi_length: 14
    rsi_oversold: 30
    rsi_overbought: 70
    adx_length: 14
    adx_strong: 25             # ADX crossing UP through this = trend strengthening
    adx_weak: 20               # ADX crossing DOWN through this = weakening
    sma_fast: 50
    sma_slow: 200              # sign-flip of (SMA50 − SMA200) = golden/death cross
    volume_avg_length: 20
    volume_spike_mult: 2.0     # volume ≥ this × its trailing average = a spike
    volume_confirm_window: 3   # a spike within ± this many sessions of another event = "confirming"
    max_subcharts_per_stock: 3 # featured event sub-charts per stock (beyond the 1 main chart)
    subchart_width_px: 500     # size hint (w=) on event sub-chart markers → NewX .chart-md (floated card)
    subchart_priority_families: [sma]  # indicator families ALWAYS featured when present (structural SMA
                                       # golden/death-cross trend regime); the rest fill by recency. One
                                       # card per family (rsi/macd/adx/sma/volume) — no duplicate MACD cards.

# =============================================================================
# INDIVIDUAL-STOCK ANALYZER (comprehensive_stock_analyzer) resilience.
# =============================================================================
stock_analyzer:
  fetch_retries: 3              # transient Yahoo Finance errors (e.g. quoteSummary "Internal Server Error /
                                # Server caught an exception") on the .info/.history fetch are retried this many
                                # TOTAL times before the ticker fails (1 = no retry). Absorbs the AVGO-style blip.
  fetch_backoff_seconds: 0.8    # linear backoff between attempts (0.8s, 1.6s, ...); gives Yahoo time to recover

# =============================================================================
# USER TOOLS CONFIGURATION
# =============================================================================
user_tools:
  # Sandboxed Executor - Secure code execution and system command access
  sandboxed_executor:
    # Workspace settings
    base_directory: null  # null = user's home directory, or specify path
    sandbox_workspace_name: "sandbox_workspace"

    # Security limits
    execution:
      max_execution_time: 120  # seconds (increased from 30 for complex operations)
      max_output_size: 100000  # characters (increased from 50000)
      max_file_size: 52428800  # bytes (50MB, increased from 10MB)

    # Command access control
    # Set mode to control command restrictions:
    #   - strict: Only allowed_commands whitelist (default, most secure)
    #   - permissive: All commands except blocked_commands blacklist
    #   - unrestricted: All commands allowed (use with caution!)
    command_mode: "permissive"

    # Allowed commands (whitelist) - used when command_mode = "strict"
    allowed_commands:
      # Development tools
      - python3
      - python
      - node
      - npm
      - npx
      - pip
      - pip3
      - yarn
      - pnpm

      # Compilers and build tools
      - gcc
      - g++
      - clang
      - make
      - cmake
      - javac
      - java
      - rustc
      - cargo
      - go

      # System utilities
      - ls
      - cat
      - head
      - tail
      - wc
      - grep
      - find
      - echo
      - pwd
      - whoami
      - id
      - uname
      - which
      - whereis
      - file

      # File operations
      - chmod
      - mkdir
      - rmdir
      - touch
      - cp
      - mv
      - rm
      - ln

      # Archive tools
      - tar
      - gzip
      - gunzip
      - zip
      - unzip
      - bzip2
      - xz

      # Network tools
      - curl
      - wget
      - ping
      - telnet

      # Document tools
      - pandoc
      - pdflatex
      - latex
      - convert
      - gs

      # Version control
      - git
      - svn
      - hg

      # Package managers (non-sudo)
      - apt-cache  # Query package info (no sudo needed)
      - dpkg-query  # Query installed packages

    # Blocked commands (blacklist) - ALWAYS blocked regardless of mode
    # These are dangerous commands that can cause system damage
    blocked_commands:
      # Filesystem destruction
      - mkfs       # Format filesystem
      - dd         # Can overwrite disks

      # System control (without sudo config)
      - reboot
      - shutdown
      - halt
      - init
      - poweroff

      # User/permission changes (without sudo config)
      - passwd     # Change passwords
      - chown      # Change ownership
      - chgrp      # Change group

      # Dangerous patterns (these are checked as regex patterns)
      - "rm -rf /"     # Recursive delete from root
      - "rm -rf /*"    # Recursive delete from root
      - "> /dev/sd"    # Overwrite disk devices

    # Sudo/Root privilege configuration
    sudo_access:
      enabled: true  # Allow sudo commands

      # Require user approval for sudo commands
      require_approval: true  # If true, asks user before running sudo

      # Allowed sudo commands (whitelist)
      # Only these commands can be run with sudo
      allowed_sudo_commands:
        # Package management
        - apt
        - apt-get
        - apt-cache
        - dpkg
        - snap
        - flatpak

        # System services
        - systemctl
        - service

        # Network configuration
        - ip
        - ifconfig
        - netstat

        # File system
        - mount
        - umount
        - chown
        - chmod

        # Others
        - docker
        - docker-compose
        - nginx
        - apache2

      # Blocked sudo commands (blacklist)
      # These are NEVER allowed even with sudo
      blocked_sudo_commands:
        - rm
        - mkfs
        - dd
        - fdisk
        - parted
        - passwd
        - userdel
        - groupdel
        - reboot
        - shutdown
        - halt
        - init

    # File system access
    filesystem:
      # Default base directory (null = user home directory)
      default_base: null  # null = Path.home()

      # Allow absolute paths outside base directory
      allow_absolute_paths: true

      # Restricted paths (never accessible)
      restricted_paths:
        - /etc/shadow
        - /etc/passwd
        - /root
        - /proc
        - /sys
        - /dev
        - /boot

      # Allowed additional paths (beyond base directory)
      allowed_paths:
        - /tmp
        - /var/tmp
        - /opt
        - /usr/local

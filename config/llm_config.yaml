# =============================================================================
# USER TOOLS CONFIGURATION
# =============================================================================
user_tools:
  # Sandboxed Executor - Secure code execution and system command access
  sandboxed_executor:
    # Workspace settings
    base_directory: null  # null = user's home directory, or specify path
    sandbox_workspace_name: "sandbox_workspace"

    # Security limits
    execution:
      max_execution_time: 120  # seconds (increased from 30 for complex operations)
      max_output_size: 100000  # characters (increased from 50000)
      max_file_size: 52428800  # bytes (50MB, increased from 10MB)

    # Command access control
    # Set mode to control command restrictions:
    #   - strict: Only allowed_commands whitelist (default, most secure)
    #   - permissive: All commands except blocked_commands blacklist
    #   - unrestricted: All commands allowed (use with caution!)
    command_mode: "permissive"

    # Allowed commands (whitelist) - used when command_mode = "strict"
    allowed_commands:
      # Development tools
      - python3
      - python
      - node
      - npm
      - npx
      - pip
      - pip3
      - yarn
      - pnpm

      # Compilers and build tools
      - gcc
      - g++
      - clang
      - make
      - cmake
      - javac
      - java
      - rustc
      - cargo
      - go

      # System utilities
      - ls
      - cat
      - head
      - tail
      - wc
      - grep
      - find
      - echo
      - pwd
      - whoami
      - id
      - uname
      - which
      - whereis
      - file

      # File operations
      - chmod
      - mkdir
      - rmdir
      - touch
      - cp
      - mv
      - rm
      - ln

      # Archive tools
      - tar
      - gzip
      - gunzip
      - zip
      - unzip
      - bzip2
      - xz

      # Network tools
      - curl
      - wget
      - ping
      - telnet

      # Document tools
      - pandoc
      - pdflatex
      - latex
      - convert
      - gs

      # Version control
      - git
      - svn
      - hg

      # Package managers (non-sudo)
      - apt-cache  # Query package info (no sudo needed)
      - dpkg-query  # Query installed packages

    # Blocked commands (blacklist) - ALWAYS blocked regardless of mode
    # These are dangerous commands that can cause system damage
    blocked_commands:
      # Filesystem destruction
      - mkfs       # Format filesystem
      - dd         # Can overwrite disks

      # System control (without sudo config)
      - reboot
      - shutdown
      - halt
      - init
      - poweroff

      # User/permission changes (without sudo config)
      - passwd     # Change passwords
      - chown      # Change ownership
      - chgrp      # Change group

      # Dangerous patterns (these are checked as regex patterns)
      - "rm -rf /"     # Recursive delete from root
      - "rm -rf /*"    # Recursive delete from root
      - "> /dev/sd"    # Overwrite disk devices

    # Sudo/Root privilege configuration
    sudo_access:
      enabled: true  # Allow sudo commands

      # Require user approval for sudo commands
      require_approval: true  # If true, asks user before running sudo

      # Allowed sudo commands (whitelist)
      # Only these commands can be run with sudo
      allowed_sudo_commands:
        # Package management
        - apt
        - apt-get
        - apt-cache
        - dpkg
        - snap
        - flatpak

        # System services
        - systemctl
        - service

        # Network configuration
        - ip
        - ifconfig
        - netstat

        # File system
        - mount
        - umount
        - chown
        - chmod

        # Others
        - docker
        - docker-compose
        - nginx
        - apache2

      # Blocked sudo commands (blacklist)
      # These are NEVER allowed even with sudo
      blocked_sudo_commands:
        - rm
        - mkfs
        - dd
        - fdisk
        - parted
        - passwd
        - userdel
        - groupdel
        - reboot
        - shutdown
        - halt
        - init

    # File system access
    filesystem:
      # Default base directory (null = user home directory)
      default_base: null  # null = Path.home()

      # Allow absolute paths outside base directory
      allow_absolute_paths: true

      # Restricted paths (never accessible)
      restricted_paths:
        - /etc/shadow
        - /etc/passwd
        - /root
        - /proc
        - /sys
        - /dev
        - /boot

      # Allowed additional paths (beyond base directory)
      allowed_paths:
        - /tmp
        - /var/tmp
        - /opt
        - /usr/local

code_generation:
  type: gemini
  fallback:
    enabled: true
    order:
      - gemini
      - ollama
      - anthropic
      - openai
      - qwen

  providers:
    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      model: claude-3-5-sonnet-20240620
      temperature: 0.0
      max_tokens: 4096

    openai:
      api_key: ${OPENAI_API_KEY}
      model: gpt-4o
      temperature: 0.0
      max_tokens: 4096

    gemini:
      api_key: ${GEMINI_API_KEY}
      model: gemini-2.5-pro
      temperature: 0.0
      max_tokens: 32768
      timeout: 300

    ollama:
      base_url: http://localhost:11434
      model: qwen3-coder:480b-cloud
      temperature: 0.0
      max_tokens: 32768
      timeout: 600

    qwen:
      api_key: ${QWEN_API_KEY}
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-max
      temperature: 0.0
      max_tokens: 6000

crud_prompt:
  python_fastapi: |
    Generate COMPLETE, PRODUCTION-READY CRUD operations for {model_name} model.

    CRITICAL REQUIREMENTS:
    1. Generate ALL 5 CRUD functions with full implementations
    2. Include ALL necessary imports (Session, Optional, List, UUID, etc.)
    3. Use proper type hints for all parameters and return values
    4. Add comprehensive docstrings with Args, Returns, and Raises sections
    5. Include proper error handling for database operations
    6. Handle not found cases appropriately
    7. Use proper session management (commit, rollback, refresh)

    REQUIRED FUNCTIONS TO IMPLEMENT:
    - create_{model_name_lower}(db: Session, obj_in: schema) -> {model_name}
    - get_{model_name_lower}(db: Session, id: UUID) -> Optional[{model_name}]
    - get_{model_name_lower}s(db: Session, skip: int = 0, limit: int = 100) -> List[{model_name}]
    - update_{model_name_lower}(db: Session, id: UUID, obj_in: schema) -> {model_name}
    - delete_{model_name_lower}(db: Session, id: UUID) -> bool

    STRUCTURAL EXAMPLE (adapt for your model):
    ```python
    from sqlalchemy.orm import Session
    from sqlalchemy.exc import IntegrityError
    from typing import Optional, List
    from uuid import UUID
    from app.models.example import ExampleModel
    from app.schemas.example import ExampleCreate, ExampleUpdate

    def create_example(db: Session, obj_in: ExampleCreate) -> ExampleModel:
        '''Create new example instance.

        Args:
            db: Database session
            obj_in: Example creation schema with validated data

        Returns:
            Created example instance

        Raises:
            IntegrityError: If unique constraint violated
        '''
        db_obj = ExampleModel(**obj_in.dict())
        db.add(db_obj)
        db.commit()
        db.refresh(db_obj)
        return db_obj

    def get_example(db: Session, id: UUID) -> Optional[ExampleModel]:
        '''Get example by ID.'''
        return db.query(ExampleModel).filter(ExampleModel.id == id).first()

    # ... implement all other CRUD functions
    ```

    IMPORTANT: This is just a structural example. Generate ACTUAL functions for {model_name} with:
    - Correct function names using {model_name_lower}
    - Proper model imports (app.models.{model_name_lower})
    - Proper schema imports
    - Complete implementations (no TODOs or placeholders)
    - All 5 CRUD functions fully implemented

    DO NOT include comments like "# Add more functions" or "# TODO".
    Generate the COMPLETE, WORKING CRUD module now.

  php_laravel: |
    Generate Laravel Service/Repository for {model_name}.

    Methods needed:
    - create(array $data): {model_name}
    - find($id): ?{model_name}
    - all(int $perPage): LengthAwarePaginator

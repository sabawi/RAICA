model_prompt:
  python_fastapi: |
    Generate a COMPLETE, PRODUCTION-READY SQLAlchemy model for: {model_name}

    CRITICAL REQUIREMENTS:
    1. Generate the ENTIRE model class with ALL fields specified below
    2. Include ALL necessary imports at the top of the file
    3. Use proper SQLAlchemy Column types with appropriate constraints
    4. Add indexes for frequently queried fields (foreign keys, unique fields)
    5. Include comprehensive docstrings explaining the model's purpose
    6. Use UUID primary keys for security (unless specified otherwise)
    7. Add created_at and updated_at timestamp fields automatically
    8. Define proper table name using __tablename__

    REQUIRED FIELDS FOR THIS MODEL:
    {fields}

    RELATIONSHIPS TO IMPLEMENT:
    {relationships}

    STRUCTURAL EXAMPLE (adapt this pattern for your specific model):
    ```python
    from sqlalchemy import Column, String, Integer, Boolean, DateTime, ForeignKey, Text
    from sqlalchemy.dialects.postgresql import UUID
    from sqlalchemy.orm import relationship
    from datetime import datetime
    import uuid
    from app.core.database import Base

    class ExampleModel(Base):
        '''
        Example model showing the expected structure.
        Adapt this pattern with the actual fields and relationships specified above.
        '''
        __tablename__ = "example_table"

        # Primary key
        id = Column(UUID(as_uuid=True), primary_key=True, default=uuid.uuid4)

        # Your actual fields go here (use the fields specified above)
        name = Column(String(255), nullable=False, index=True)
        email = Column(String(255), unique=True, nullable=False, index=True)
        is_active = Column(Boolean, default=True, nullable=False)

        # Timestamps
        created_at = Column(DateTime, default=datetime.utcnow, nullable=False)
        updated_at = Column(DateTime, default=datetime.utcnow, onupdate=datetime.utcnow, nullable=False)

        # Relationships (if any)
        # items = relationship("Item", back_populates="owner")
    ```

    IMPORTANT: This is just a structural example. Generate the ACTUAL model with:
    - The correct model name: {model_name}
    - ALL the fields listed above (not the example fields)
    - ALL the relationships listed above
    - Appropriate SQLAlchemy column types matching the field types
    - Proper foreign key constraints for relationships

    DO NOT include placeholder comments like "# Add more fields" or "# TODO".
    Generate the COMPLETE, WORKING model code now.

  php_laravel: |
    Generate Eloquent model: {model_name}

    Include:
    - Namespace App\Models
    - Proper table name definition
    - Fillable properties
    - Relationship methods (hasMany, belongsTo, etc.)
    - Casts for attributes
    - Fields: {fields}
    - Relationships: {relationships}

  nodejs_express: |
    Generate Sequelize model: {model_name}

    Include:
    - Define model using sequelize.define
    - Proper data types
    - Association definitions
    - Fields: {fields}
    - Relationships: {relationships}


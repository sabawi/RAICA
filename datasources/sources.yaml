# Declarative data-source catalog (design: docs/DESIGN_data_charts.md).
#
# Each entry describes ONE authoritative source so a generic DeclarativeAdapter can fetch + parse it — a
# new "normal" JSON source is added HERE, no Python. Response structural variety is handled by `shape:`
# (a small library of reusable handlers in shapes.py), not per-site code. KEY-AGNOSTIC: keyless open
# sources (world_bank) sit alongside key-required ones (fbi_cde); auth.type=none needs no key.
#
# Field map keys accept a LIST of aliases (first present wins). All numbers still flow through
# DatasetSeries validation (fail-closed) + the payload store (numbers-by-reference).

sources:

  fbi_cde:
    tier: structured_api
    source_name: "FBI UCR / Crime Data Explorer"
    home_url: "https://cde.ucr.cjis.gov/"
    title_template: "U.S. {label} {value_kind}, {x_min}–{x_max}"
    endpoint: "https://api.usa.gov/crime/fbi/cde/estimate/national/{measure_path}"
    auth: { type: query_key, param: API_KEY, env: [FBI_CDE_API_KEY, DATA_GOV_API_KEY] }
    params: { from: "{from_year}", to: "{to_year}" }
    shape: flat_json
    records_path: results
    geo_label: "US-national"
    coverage: "~1979–present (SRS through 2020; NIBRS 2021+)"
    value_kinds: [rate, count]
    x: { field: [data_year, year], type: temporal, name: year }
    value:
      field: [rate, rate_per_100000]          # direct value for value_kind=rate
      count_field: [count, value, actual, estimate]
      population_field: [population, pop]
      rate_per: 100000                          # rate = count / pop * rate_per
      unit_rate: "per 100,000"
      unit_count: "offenses"
    methodology: "FBI UCR estimates: Summary Reporting System (SRS) through 2020, NIBRS 2021–present."
    discontinuities:
      - { at: 2021, note: "SRS→NIBRS", requires_span: true }
    measures:
      violent-crime:        { label: "violent crime",        path: "violent-crime" }
      homicide:             { label: "homicide",             path: "homicide" }
      rape:                 { label: "rape",                 path: "rape" }
      robbery:              { label: "robbery",              path: "robbery" }
      aggravated-assault:   { label: "aggravated assault",   path: "aggravated-assault" }
      property-crime:       { label: "property crime",       path: "property-crime" }
      burglary:             { label: "burglary",             path: "burglary" }
      larceny:              { label: "larceny-theft",        path: "larceny" }
      motor-vehicle-theft:  { label: "motor vehicle theft",  path: "motor-vehicle-theft" }
      arson:                { label: "arson",                path: "arson" }

  world_bank:
    tier: structured_api
    source_name: "World Bank Open Data"
    home_url: "https://data.worldbank.org/"
    title_template: "{label} ({geo}), {x_min}–{x_max}"
    # keyless open API. {geo_path} = country code (default USA); {measure_path} = indicator code.
    endpoint: "https://api.worldbank.org/v2/country/{geo_path}/indicator/{measure_path}?format=json&per_page=20000"
    auth: { type: none }
    params: { date: "{from_year}:{to_year}" }   # WB accepts a date RANGE; dropped if both years absent
    shape: worldbank
    geo_default: "USA"
    coverage: "1960–present (varies by indicator)"
    value_kinds: [value]
    x: { field: [date], type: temporal, name: year }
    value: { field: [value] }                    # unit comes from the measure below
    measures:
      population:        { label: "population",                 path: "SP.POP.TOTL",     unit: "people" }
      gdp:               { label: "GDP (current US$)",          path: "NY.GDP.MKTP.CD",  unit: "current US$" }
      gdp-per-capita:    { label: "GDP per capita (current US$)", path: "NY.GDP.PCAP.CD", unit: "current US$" }
      co2-per-capita:    { label: "CO₂ emissions per capita",   path: "EN.ATM.CO2E.PC",  unit: "t per capita" }
      life-expectancy:   { label: "life expectancy at birth",   path: "SP.DYN.LE00.IN",  unit: "years" }
      unemployment:      { label: "unemployment rate",          path: "SL.UEM.TOTL.ZS",  unit: "% of labor force" }
      inflation:         { label: "inflation (CPI)",            path: "FP.CPI.TOTL.ZG",  unit: "% annual" }
